 "js/data.js": '// 中华美食消消乐 · 静态配置\n// 纯数据，无平台依赖，可被主域与预览环境共用。\n\nconst TILES = [\n  { key: \'mala\',    name: \'麻婆豆腐\', region: \'四川\', emoji: \'🌶️\', color: \'#ff6a3d\', light: \'#ff9d7a\', deep: \'#d9461c\' },\n  { key: \'danta\',   name: \'蛋挞\',     region: \'广东\', emoji: \'🍮\', color: \'#ffd23f\', light: \'#ffe27f\', deep: \'#d9a200\' },\n  { key: \'yutou\',   name: \'剁椒鱼头\', region: \'湖南\', emoji: \'🐟\', color: \'#2f4fd6\', light: \'#6b86f0\', deep: \'#1d3aab\' },\n  { key: \'xiaolong\',name: \'小笼包\',   region: \'江浙\', emoji: \'🥟\', color: \'#4cd964\', light: \'#86e893\', deep: \'#2c9e43\' },\n  { key: \'hulu\',    name: \'糖葫芦\',   region: \'北京\', emoji: \'🍡\', color: \'#ff6fb5\', light: \'#ff9dcc\', deep: \'#d63b8c\' },\n  { key: \'haoli\',   name: \'海蛎煎\',   region: \'福建\', emoji: \'🦐\', color: \'#2fc8c0\', light: \'#74ded8\', deep: \'#16938c\' },\n  { key: \'paomo\',   name: \'羊肉泡馍\', region: \'陕西\', emoji: \'🍲\', color: \'#b855ff\', light: \'#d89bff\', deep: \'#8c2ed6\' }\n];\n\n// 24 个成就。seal 用作朱红印章里的单字\nconst ACHIEVEMENTS = [\n  { id: \'first\',      name: \'初出茅庐\', seal: \'初\', desc: \'完成第一局\' },\n  { id: \'score_500\',  name: \'小有名气\', seal: \'香\', desc: \'单局 500 分\' },\n  { id: \'score_1500\', name: \'一方名厨\', seal: \'厨\', desc: \'单局 1500 分\' },\n  { id: \'score_3000\', name: \'掌勺大师\', seal: \'勺\', desc: \'单局 2500 分\' },\n  { id: \'score_6000\', name: \'御膳总管\', seal: \'膳\', desc: \'单局 4000 分\' },\n  { id: \'score_10000\',name: \'食神降临\', seal: \'神\', desc: \'单局 6000 分\' },\n  { id: \'score_15000\',name: \'八方至尊\', seal: \'尊\', desc: \'单局 8000 分\' },\n  { id: \'combo_3\',    name: \'三连锅气\', seal: \'三\', desc: \'单次连锁 3 段\' },\n  { id: \'combo_5\',    name: \'五连爆香\', seal: \'五\', desc: \'单次连锁 5 段\' },\n  { id: \'combo_7\',    name: \'七连天火\', seal: \'火\', desc: \'单次连锁 7 段\' },\n  { id: \'clear_10\',   name: \'十全大补\', seal: \'十\', desc: \'一次消除 10 块\' },\n  { id: \'clear_15\',   name: \'十五连环\', seal: \'连\', desc: \'一次消除 15 块\' },\n  { id: \'heat_max\',   name: \'锅气冲天\', seal: \'焰\', desc: \'锅气升到满级\' },\n  { id: \'lucky_12\',   name: \'彩头满盘\', seal: \'彩\', desc: \'单局彩头命中 8 块\' },\n  { id: \'all_types\',  name: \'七味齐全\', seal: \'味\', desc: \'一局内七种菜都消除过\' },\n  { id: \'speed_1500\', name: \'快手快炒\', seal: \'快\', desc: \'开局 30 秒内得 1500 分\' },\n  { id: \'no_shuffle_3000\', name: \'一气呵成\', seal: \'成\', desc: \'不重排拿到 2000 分\' },\n  { id: \'games_5\',    name: \'老饕常客\', seal: \'饕\', desc: \'累计完成 5 局\' },\n  { id: \'games_10\',   name: \'十局老友\', seal: \'友\', desc: \'累计完成 10 局\' },\n  { id: \'rank_1\',     name: \'榜上有名\', seal: \'榜\', desc: \'登上全服榜首\' },\n  { id: \'combo_2\',    name: \'二连开锅\', seal: \'开\', desc: \'单次连锁 2 段\' },\n  { id: \'clear_5\',    name: \'五福临门\', seal: \'福\', desc: \'一次消除 5 块\' },\n  { id: \'heat_3\',     name: \'锅气渐起\', seal: \'渐\', desc: \'锅气升到 3 级\' },\n  { id: \'lucky_5\',    name: \'彩头初现\', seal: \'彩\', desc: \'单局彩头命中 5 块\' }\n];\n\n// 结算称号（按分数从高到低匹配）\nconst RANKS = [\n  { min: 8000,  title: \'八方食神\', note: \'八大菜系尽在掌中\' },\n  { min: 6000,  title: \'御膳大厨\', note: \'火候老到，锅气贯顶\' },\n  { min: 4000,  title: \'一方名厨\', note: \'街坊排队只为这一口\' },\n  { min: 2500,  title: \'掌勺好手\', note: \'颠勺利落，出菜飞快\' },\n  { min: 1200,  title: \'后厨新星\', note: \'刀工渐稳，前途可期\' },\n  { min: 500,   title: \'学艺小厨\', note: \'还在灶台边打下手\' },\n  { min: 0,     title: \'灶前学徒\', note: \'先把火点着再说\' }\n];\n\nconst CONFIG = {\n  boardSize: 8,\n  typeCount: 7,\n  maxMoves: 20,           // 单局步数上限\n  roundSeconds: 60,\n  timeBonusSeconds: 10,   // 每满 1000 分加时\n  timeBonusStep: 1000,\n  heatMax: 5,\n  heatWindow: 5,          // 锅气 5 秒窗口\n  luckyPerRun: 3,         // 每局彩头菜数量\n  hintLimit: 1,\n  shuffleLimit: 1,\n  // 微信激励视频广告位 ID：留空时点击「看广告」直接赠送次数（开发调试用）。\n  // 上线前在微信后台创建激励视频广告，把 adUnitId 填到这里。\n  rewardedAdId: \'\',\n  // 微信云开发环境 ID：在小游戏「云开发」控制台复制后填这里，\n  // 留空则排行榜显示为「未配置」，本地玩法不受影响。\n  cloudEnv: \'\'\n};\n\nfunction rankOf(score) {\n  for (let i = 0; i < RANKS.length; i++) {\n    if (score >= RANKS[i].min) return RANKS[i];\n  }\n  return RANKS[RANKS.length - 1];\n}\n\nmodule.exports = { TILES, ACHIEVEMENTS, RANKS, CONFIG, rankOf };\n',
 "js/platform.js": '// 平台适配层：抹平「微信小游戏」与「浏览器预览」的差异。\n// 主域代码只依赖这里暴露的接口，不直接写 wx.* / document.*。\n\nconst isWx = typeof wx !== \'undefined\' && typeof wx.getSystemInfoSync === \'function\';\n\nfunction getWindowInfo() {\n  if (isWx) {\n    let info = null;\n    try {\n      info = wx.getWindowInfo ? wx.getWindowInfo() : wx.getSystemInfoSync();\n    } catch (e) {\n      info = wx.getSystemInfoSync();\n    }\n    const screenH = info.screenHeight || info.windowHeight;\n    const safe = info.safeArea || { top: 0, bottom: screenH };\n    return {\n      width: info.windowWidth,\n      height: info.windowHeight,\n      dpr: Math.min(info.pixelRatio || 1, 3),\n      safeTop: safe.top || 0,\n      safeBottom: Math.max(0, screenH - (safe.bottom || screenH))\n    };\n  }\n  const w = typeof window !== \'undefined\' ? window : { innerWidth: 375, innerHeight: 667 };\n  return {\n    width: w.innerWidth,\n    height: w.innerHeight,\n    dpr: Math.min((w.devicePixelRatio || 1), 3),\n    safeTop: 0,\n    safeBottom: 0\n  };\n}\n\nfunction createCanvas() {\n  if (isWx) return wx.createCanvas();\n  const c = document.getElementById(\'game\');\n  if (c) return c;\n  const nc = document.createElement(\'canvas\');\n  nc.id = \'game\';\n  document.body.appendChild(nc);\n  return nc;\n}\n\n// 离屏画布：小游戏里第一个 createCanvas 是主画布，之后创建的都是离屏画布\nfunction createOffscreen() {\n  if (isWx) return wx.createCanvas();\n  return document.createElement(\'canvas\');\n}\n\nfunction resizeCanvas(canvas, ctx, w, h, dpr) {\n  canvas.width = Math.floor(w * dpr);\n  canvas.height = Math.floor(h * dpr);\n  if (canvas.style) {\n    canvas.style.width = w + \'px\';\n    canvas.style.height = h + \'px\';\n  }\n  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);\n}\n\nfunction raf(fn) {\n  if (typeof requestAnimationFrame === \'function\') return requestAnimationFrame(fn);\n  return setTimeout(() => fn(Date.now()), 16);\n}\n\n// 触摸 / 鼠标统一为 {x, y}\nfunction bindPointer(canvas, handlers) {\n  const pick = (touch) => {\n    const x = touch.clientX !== undefined ? touch.clientX : touch.pageX;\n    const y = touch.clientY !== undefined ? touch.clientY : touch.pageY;\n    return { x, y };\n  };\n  if (isWx) {\n    wx.onTouchStart((e) => handlers.start(pick(e.touches[0] || e.changedTouches[0])));\n    wx.onTouchMove((e) => handlers.move(pick(e.touches[0] || e.changedTouches[0])));\n    wx.onTouchEnd((e) => {\n      const t = e.changedTouches && e.changedTouches[0];\n      handlers.end(t ? pick(t) : null);\n    });\n    wx.onTouchCancel(() => handlers.cancel && handlers.cancel());\n    return;\n  }\n  let down = false;\n  const onDown = (e) => {\n    down = true;\n    const t = e.touches ? e.touches[0] : e;\n    handlers.start(pick(t));\n    if (e.cancelable) e.preventDefault();\n  };\n  const onMove = (e) => {\n    if (!down) return;\n    const t = e.touches ? e.touches[0] : e;\n    handlers.move(pick(t));\n    if (e.cancelable) e.preventDefault();\n  };\n  const onUp = (e) => {\n    if (!down) return;\n    down = false;\n    const t = e.changedTouches ? e.changedTouches[0] : e;\n    handlers.end(t ? pick(t) : null);\n    if (e.cancelable) e.preventDefault();\n  };\n  canvas.addEventListener(\'touchstart\', onDown, { passive: false });\n  canvas.addEventListener(\'touchmove\', onMove, { passive: false });\n  canvas.addEventListener(\'touchend\', onUp, { passive: false });\n  canvas.addEventListener(\'mousedown\', onDown);\n  window.addEventListener(\'mousemove\', onMove);\n  window.addEventListener(\'mouseup\', onUp);\n}\n\nconst storage = {\n  get(key, def) {\n    try {\n      if (isWx) {\n        const v = wx.getStorageSync(key);\n        return (v === \'\' || v === undefined || v === null) ? def : v;\n      }\n      const raw = localStorage.getItem(key);\n      return raw === null ? def : JSON.parse(raw);\n    } catch (e) {\n      return def;\n    }\n  },\n  set(key, value) {\n    try {\n      if (isWx) wx.setStorageSync(key, value);\n      else localStorage.setItem(key, JSON.stringify(value));\n    } catch (e) { /* 存储失败不影响游戏 */ }\n  }\n};\n\nfunction vibrate(strong) {\n  try {\n    if (isWx) {\n      if (wx.vibrateShort) wx.vibrateShort({ type: strong ? \'medium\' : \'light\' });\n    } else if (navigator.vibrate) {\n      navigator.vibrate(strong ? 24 : 10);\n    }\n  } catch (e) { /* ignore */ }\n}\n\n// 昵称输入：小游戏用系统键盘，浏览器用 prompt\nfunction editName(current, onDone) {\n  if (isWx && wx.showKeyboard) {\n    let settled = false;\n    const done = (v) => {\n      if (settled) return;\n      settled = true;\n      try { wx.hideKeyboard({}); } catch (e) { /* ignore */ }\n      const name = String(v || \'\').trim().slice(0, 8);\n      onDone(name || current);\n    };\n    wx.onKeyboardConfirm((e) => done(e.value));\n    wx.onKeyboardComplete((e) => done(e.value));\n    wx.showKeyboard({\n      defaultValue: current,\n      maxLength: 8,\n      multiple: false,\n      confirmHold: false,\n      confirmType: \'done\',\n      fail: () => { settled = true; onDone(current); }\n    });\n    return;\n  }\n  const v = typeof window !== \'undefined\' ? window.prompt(\'起个厨师名（最多 8 个字）\', current) : null;\n  onDone(v ? String(v).trim().slice(0, 8) || current : current);\n}\n\nfunction toastNative(text) {\n  if (isWx && wx.showToast) {\n    try { wx.showToast({ title: text, icon: \'none\', duration: 1400 }); } catch (e) { /* ignore */ }\n  }\n}\n\n// 微信昵称：用原生「用户信息按钮」覆盖在左上角昵称位置。\n// 用户点击后弹出微信授权，回调返回 { nickName, avatarUrl }；未授权则返回 null。\nfunction createUserInfoButton(rect, onUserInfo) {\n  if (!isWx || !wx.createUserInfoButton) return null;\n  let btn = null;\n  try {\n    btn = wx.createUserInfoButton({\n      type: \'text\',\n      text: \'\',\n      style: {\n        left: rect.x,\n        top: rect.y,\n        width: rect.w,\n        height: rect.h,\n        backgroundColor: \'rgba(0,0,0,0)\',\n        color: \'rgba(0,0,0,0)\',\n        borderWidth: 0,\n        borderRadius: 0,\n        fontSize: 1,\n        lineHeight: rect.h,\n        textAlign: \'left\'\n      },\n      withCredentials: false,\n      lang: \'zh_CN\'\n    });\n  } catch (e) {\n    return null;\n  }\n  if (!btn || !btn.onTap) return btn;\n  btn.onTap((res) => {\n    if (res && res.userInfo && res.userInfo.nickName) {\n      onUserInfo(res.userInfo);\n      return;\n    }\n    // 少数基础库不会直接回传资料，再补一次 getUserInfo\n    if (wx.getUserInfo) {\n      wx.getUserInfo({\n        withCredentials: false,\n        lang: \'zh_CN\',\n        success: (r) => onUserInfo((r && r.userInfo) || null),\n        fail: () => onUserInfo(null)\n      });\n    } else {\n      onUserInfo(null);\n    }\n  });\n  return btn;\n}\n\n// 音频解锁：微信小游戏设置音频参数，确保音效在静音键下也能播放\nfunction unlockAudio() {\n  if (isWx && wx.setInnerAudioOption) {\n    try { wx.setInnerAudioOption({ obeyMuteSwitch: false, mixWithOther: true }); } catch (e) { /* ignore */ }\n  }\n}\n\n// ---------------- 激励视频广告 ----------------\n// 单例复用 + 预加载，避免每次创建实例；show 失败自动 reload 重试。\nlet rewardedAd = null;\nlet rewardedLoading = false;\nlet rewardedAdUnitId = \'\';\n\n// 预加载广告实例（游戏启动时调用一次）\nfunction preloadRewardedAd(adUnitId) {\n  rewardedAdUnitId = adUnitId || \'\';\n  if (!isWx || !rewardedAdUnitId || rewardedAd) return;\n  try {\n    rewardedAd = wx.createRewardedVideoAd({ adUnitId: rewardedAdUnitId });\n    rewardedAd.load().catch(() => { /* 加载失败忽略，下次 show 时重试 */ });\n  } catch (e) { /* ignore */ }\n}\n\n// 展示激励视频：返回 Promise<boolean>，看完 resolve(true)，中途关闭/失败 reject。\nfunction showRewardedAd(adUnitId) {\n  return new Promise((resolve, reject) => {\n    // 非微信环境或未配置广告位：直接发奖（开发调试）\n    if (!isWx || !adUnitId) {\n      resolve(true);\n      return;\n    }\n    // 防止重复点击\n    if (rewardedLoading) {\n      reject(new Error(\'ad_loading\'));\n      return;\n    }\n    rewardedLoading = true;\n\n    const id = adUnitId || rewardedAdUnitId;\n    if (!id) {\n      rewardedLoading = false;\n      resolve(true);\n      return;\n    }\n\n    // 确保单例存在\n    if (!rewardedAd) {\n      try {\n        rewardedAd = wx.createRewardedVideoAd({ adUnitId: id });\n      } catch (e) {\n        rewardedLoading = false;\n        reject(e);\n        return;\n      }\n    }\n\n    let settled = false;\n    const done = (ok, err) => {\n      if (settled) return;\n      settled = true;\n      rewardedLoading = false;\n      if (ok) resolve(true);\n      else reject(err || new Error(\'ad_failed\'));\n    };\n\n    const onClose = (res) => {\n      rewardedAd.offClose && rewardedAd.offClose(onClose);\n      rewardedAd.offError && rewardedAd.offError(onError);\n      // 看完广告才发奖\n      if (res && res.isEnded) done(true);\n      else done(false, new Error(\'ad_not_finished\'));\n      // 播完后重新预加载下一条\n      rewardedAd.load().catch(() => {});\n    };\n    const onError = (err) => {\n      rewardedAd.offClose && rewardedAd.offClose(onClose);\n      rewardedAd.offError && rewardedAd.offError(onError);\n      done(false, err);\n    };\n\n    rewardedAd.onClose(onClose);\n    rewardedAd.onError(onError);\n\n    const tryShow = () => {\n      rewardedAd.show()\n        .catch(() => {\n          // show 失败通常是没加载好，reload 后再 show 一次\n          rewardedAd.load().then(() => rewardedAd.show()).catch((e) => done(false, e));\n        });\n    };\n    tryShow();\n  });\n}\n\nmodule.exports = {\n  isWx,\n  getWindowInfo,\n  createCanvas,\n  createOffscreen,\n  resizeCanvas,\n  raf,\n  bindPointer,\n  storage,\n  vibrate,\n  editName,\n  toastNative,\n  createUserInfoButton,\n  unlockAudio,\n  preloadRewardedAd,\n  showRewardedAd,\n  cloud: isWx ? (wx.cloud || null) : null\n};\n',
 "js/storage.js": '// 本地档案：昵称、历史最高、累计局数、已解锁成就、排行榜缓存\nconst platform = require(\'./platform.js\');\n\nconst KEY = \'mg_profile_v1\';\n\nconst DEFAULT = {\n  name: \'\',\n  wxName: \'\',\n  best: 0,\n  games: 0,\n  total: 0,\n  unlocked: [],\n  lastPlayed: 0\n};\n\nfunction randomName() {\n  const n = Math.floor(1000 + Math.random() * 9000);\n  return \'食客\' + n;\n}\n\nfunction load() {\n  const raw = platform.storage.get(KEY, null);\n  const data = Object.assign({}, DEFAULT);\n  if (raw && typeof raw === \'object\') {\n    if (typeof raw.name === \'string\') data.name = raw.name;\n    if (typeof raw.wxName === \'string\') data.wxName = raw.wxName;\n    if (typeof raw.best === \'number\') data.best = raw.best;\n    if (typeof raw.games === \'number\') data.games = raw.games;\n    if (typeof raw.total === \'number\') data.total = raw.total;\n    if (Array.isArray(raw.unlocked)) data.unlocked = raw.unlocked.slice();\n    if (typeof raw.lastPlayed === \'number\') data.lastPlayed = raw.lastPlayed;\n  }\n  if (!data.name) {\n    data.name = randomName();\n    save(data);\n  }\n  return data;\n}\n\nfunction save(data) {\n  platform.storage.set(KEY, {\n    name: data.name,\n    wxName: data.wxName,\n    best: data.best,\n    games: data.games,\n    total: data.total,\n    unlocked: data.unlocked,\n    lastPlayed: data.lastPlayed\n  });\n}\n\nmodule.exports = { load, save, randomName };\n',
 "js/audio.js": '// 音效：全部用 WebAudio 实时合成，不依赖任何音频文件（小游戏主包 4MB 友好）。\nconst platform = require(\'./platform.js\');\n\nlet ctx = null;\nlet ready = false;\nlet muted = false;\n\nfunction ensure() {\n  if (ready) return ctx;\n  ready = true;\n  try {\n    if (platform.isWx) {\n      if (wx.createWebAudioContext) ctx = wx.createWebAudioContext();\n    } else {\n      const AC = window.AudioContext || window.webkitAudioContext;\n      if (AC) ctx = new AC();\n    }\n  } catch (e) {\n    ctx = null;\n  }\n  return ctx;\n}\n\nfunction tone(freq, dur, type, vol, delay, slideTo) {\n  if (muted) return;\n  const ac = ensure();\n  if (!ac) return;\n  try {\n    const t0 = ac.currentTime + (delay || 0);\n    const osc = ac.createOscillator();\n    const gain = ac.createGain();\n    osc.type = type || \'sine\';\n    osc.frequency.setValueAtTime(freq, t0);\n    if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);\n    gain.gain.setValueAtTime(0.0001, t0);\n    gain.gain.exponentialRampToValueAtTime(vol || 0.12, t0 + 0.012);\n    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);\n    osc.connect(gain);\n    gain.connect(ac.destination);\n    osc.start(t0);\n    osc.stop(t0 + dur + 0.02);\n  } catch (e) { /* 静默失败 */ }\n}\n\nconst SFX = {\n  tap() { tone(620, 0.06, \'sine\', 0.07); },\n  swap() { tone(520, 0.08, \'triangle\', 0.09, 0, 720); },\n  bad() { tone(220, 0.16, \'square\', 0.05, 0, 150); },\n  match(step) {\n    const base = 520 + Math.min(step, 8) * 60;\n    tone(base, 0.12, \'sine\', 0.1);\n    tone(base * 1.5, 0.1, \'triangle\', 0.05, 0.03);\n  },\n  combo(step) {\n    const base = 660 + Math.min(step, 8) * 80;\n    tone(base, 0.14, \'triangle\', 0.11);\n    tone(base * 2, 0.09, \'sine\', 0.06, 0.02);\n  },\n  lucky() {\n    tone(880, 0.1, \'sine\', 0.1);\n    tone(1174, 0.1, \'sine\', 0.09, 0.07);\n    tone(1568, 0.16, \'sine\', 0.08, 0.14);\n  },\n  heat() { tone(340, 0.18, \'sawtooth\', 0.05, 0, 620); },\n  bonus() {\n    tone(784, 0.1, \'triangle\', 0.09);\n    tone(1046, 0.12, \'triangle\', 0.08, 0.08);\n  },\n  special() {\n    // 特效棋子触发：明亮的扫频\n    tone(440, 0.08, \'sine\', 0.1);\n    tone(660, 0.08, \'sine\', 0.1, 0.06);\n    tone(880, 0.12, \'triangle\', 0.12, 0.12);\n    tone(1320, 0.18, \'sine\', 0.09, 0.2);\n  },\n  unlock() {\n    tone(523, 0.18, \'sine\', 0.08);\n    tone(659, 0.14, \'sine\', 0.08, 0.06);\n    tone(784, 0.14, \'sine\', 0.09, 0.12);\n    tone(1046, 0.14, \'sine\', 0.1, 0.18);\n    tone(1318, 0.14, \'sine\', 0.09, 0.24);\n    tone(1568, 0.3, \'sine\', 0.11, 0.3);\n    tone(2093, 0.25, \'triangle\', 0.06, 0.36);\n  },\n  over() {\n    tone(523, 0.2, \'sine\', 0.1);\n    tone(392, 0.24, \'sine\', 0.1, 0.16);\n    tone(261, 0.4, \'sine\', 0.1, 0.34);\n  },\n  start() {\n    tone(523, 0.1, \'triangle\', 0.09);\n    tone(659, 0.1, \'triangle\', 0.09, 0.09);\n    tone(784, 0.16, \'triangle\', 0.1, 0.18);\n  }\n};\n\nfunction setMuted(v) {\n  muted = !!v;\n  platform.storage.set(\'mg_muted\', muted);\n  if (muted) stopBGM();\n}\n\n// ---------------- 背景音乐：轻松愉快的循环 ----------------\n// C - G - Am - F 进行，明快的琶音 + 低音贝斯，像开心消消乐那样轻松\nconst BGM_CHORDS = [\n  [261.63, 329.63, 392.00], // C\n  [196.00, 246.94, 293.66], // G\n  [220.00, 261.63, 329.63], // Am\n  [174.61, 220.00, 261.63]  // F\n];\nconst BGM_BASS = [130.81, 98.00, 110.00, 87.31]; // C3 G2 A2 F2\nlet bgmTimer = null;\nlet bgmGain = null;\n\nfunction startBGM() {\n  const ac = ensure();\n  if (!ac) return;\n  if (ac.state === \'suspended\' && ac.resume) {\n    try { ac.resume(); } catch (e) { /* ignore */ }\n  }\n  stopBGM();\n  if (muted) return;\n  bgmGain = ac.createGain();\n  bgmGain.gain.value = 0.45;\n  bgmGain.connect(ac.destination);\n\n  let idx = 0;\n  const beat = () => {\n    if (muted) return;\n    const t0 = ac.currentTime;\n    const dur = 2.4;\n    const chord = BGM_CHORDS[idx % BGM_CHORDS.length];\n    const bass = BGM_BASS[idx % BGM_BASS.length];\n    // 贝斯\n    const bOsc = ac.createOscillator();\n    const bG = ac.createGain();\n    bOsc.type = \'triangle\';\n    bOsc.frequency.value = bass;\n    bG.gain.setValueAtTime(0.0001, t0);\n    bG.gain.exponentialRampToValueAtTime(0.08, t0 + 0.05);\n    bG.gain.setValueAtTime(0.08, t0 + dur * 0.6);\n    bG.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);\n    bOsc.connect(bG);\n    bG.connect(bgmGain);\n    bOsc.start(t0);\n    bOsc.stop(t0 + dur);\n    // 和弦铺底（轻量）\n    for (let i = 0; i < chord.length; i++) {\n      const f = chord[i];\n      const osc = ac.createOscillator();\n      const g = ac.createGain();\n      osc.type = \'sine\';\n      osc.frequency.value = f;\n      g.gain.setValueAtTime(0.0001, t0);\n      g.gain.exponentialRampToValueAtTime(0.035, t0 + 0.3);\n      g.gain.setValueAtTime(0.035, t0 + dur - 0.4);\n      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);\n      osc.connect(g);\n      g.connect(bgmGain);\n      osc.start(t0);\n      osc.stop(t0 + dur);\n    }\n    // 轻快琶音（8 分音符）\n    const arp = [chord[0] * 2, chord[1] * 2, chord[2] * 2, chord[1] * 2, chord[0] * 2, chord[2] * 2];\n    for (let i = 0; i < arp.length; i++) {\n      const st = t0 + 0.15 + i * 0.36;\n      const osc = ac.createOscillator();\n      const g = ac.createGain();\n      osc.type = \'triangle\';\n      osc.frequency.value = arp[i];\n      g.gain.setValueAtTime(0.0001, st);\n      g.gain.exponentialRampToValueAtTime(0.05, st + 0.015);\n      g.gain.exponentialRampToValueAtTime(0.0001, st + 0.32);\n      osc.connect(g);\n      g.connect(bgmGain);\n      osc.start(st);\n      osc.stop(st + 0.35);\n    }\n    idx++;\n  };\n  beat();\n  bgmTimer = setInterval(beat, 2400);\n}\n\nfunction stopBGM() {\n  if (bgmTimer) { clearInterval(bgmTimer); bgmTimer = null; }\n  if (bgmGain) {\n    try { bgmGain.disconnect(); } catch (e) { /* ignore */ }\n    bgmGain = null;\n  }\n}\n\nfunction unlock() {\n  const ac = ensure();\n  if (ac && ac.state === \'suspended\' && ac.resume) {\n    try { ac.resume(); } catch (e) { /* ignore */ }\n  }\n  platform.unlockAudio();\n}\n\nfunction init() {\n  muted = !!platform.storage.get(\'mg_muted\', false);\n}\n\nmodule.exports = { SFX, unlock, init, setMuted, isMuted: () => muted, ensure, startBGM, stopBGM };\n',
 "js/board.js": '// 棋盘逻辑：生成、匹配、交换、下落补充、提示、重排。\n// 只依赖 data.js，不涉及渲染与输入。\n\nconst { CONFIG } = require(\'./data.js\');\n\nlet uid = 1;\n\nclass Tile {\n  constructor(type, row, col) {\n    this.id = uid++;\n    this.type = type;\n    this.row = row;\n    this.col = col;\n    this.px = col;      // 渲染用插值坐标（单位：格）\n    this.py = row;\n    this.scale = 1;\n    this.scaleX = 1;   // 水平缩放（挤压拉伸）\n    this.scaleY = 1;   // 垂直缩放（挤压拉伸）\n    this.alpha = 1;\n    this.spin = (Math.random() - 0.5) * 0.08;  // 轻微倾斜，避免呆板\n    this.lucky = false;\n    this.special = null;  // \'row\' 横条消行 | \'col\' 竖条消列\n    this.clearing = false;\n  }\n}\n\nclass Board {\n  constructor(size, typeCount) {\n    this.size = size || CONFIG.boardSize;\n    this.typeCount = typeCount || CONFIG.typeCount;\n    this.grid = [];\n    this.reset();\n  }\n\n  rndType() {\n    return Math.floor(Math.random() * this.typeCount);\n  }\n\n  reset() {\n    let guard = 0;\n    do {\n      this.grid = [];\n      for (let r = 0; r < this.size; r++) {\n        const row = [];\n        for (let c = 0; c < this.size; c++) {\n          let t = this.rndType();\n          let tries = 0;\n          while (tries++ < 30 && this._wouldMatchAt(row, r, c, t)) {\n            t = this.rndType();\n          }\n          const tile = new Tile(t, r, c);\n          tile.scale = 0.6;\n          row.push(tile);\n        }\n        this.grid.push(row);\n      }\n      guard++;\n    } while (guard < 20 && (!this.hasMove() || this.findMatches().size > 0));\n  }\n\n  _wouldMatchAt(row, r, c, type) {\n    if (c >= 2 && row[c - 1].type === type && row[c - 2].type === type) return true;\n    if (r >= 2 && this.grid[r - 1][c].type === type && this.grid[r - 2][c].type === type) return true;\n    return false;\n  }\n\n  at(r, c) {\n    if (r < 0 || c < 0 || r >= this.size || c >= this.size) return null;\n    return this.grid[r][c];\n  }\n\n  each(fn) {\n    for (let r = 0; r < this.size; r++) {\n      for (let c = 0; c < this.size; c++) {\n        const t = this.grid[r][c];\n        if (t) fn(t, r, c);\n      }\n    }\n  }\n\n  // 返回 Set<Tile>：所有处于 3 连及以上的棋子\n  findMatches() {\n    const hit = new Set();\n    const n = this.size;\n    for (let r = 0; r < n; r++) {\n      let run = 1;\n      for (let c = 1; c <= n; c++) {\n        const prev = this.grid[r][c - 1];\n        const cur = c < n ? this.grid[r][c] : null;\n        if (cur && prev && cur.type === prev.type) {\n          run++;\n        } else {\n          if (run >= 3) {\n            for (let k = c - run; k < c; k++) hit.add(this.grid[r][k]);\n          }\n          run = 1;\n        }\n      }\n    }\n    for (let c = 0; c < n; c++) {\n      let run = 1;\n      for (let r = 1; r <= n; r++) {\n        const prev = this.grid[r - 1][c];\n        const cur = r < n ? this.grid[r][c] : null;\n        if (cur && prev && cur.type === prev.type) {\n          run++;\n        } else {\n          if (run >= 3) {\n            for (let k = r - run; k < r; k++) hit.add(this.grid[k][c]);\n          }\n          run = 1;\n        }\n      }\n    }\n    return hit;\n  }\n\n  swapTiles(a, b) {\n    if (!a || !b) return;\n    const ar = a.row, ac = a.col, br = b.row, bc = b.col;\n    this.grid[ar][ac] = b;\n    this.grid[br][bc] = a;\n    a.row = br; a.col = bc;\n    b.row = ar; b.col = ac;\n  }\n\n  isAdjacent(a, b) {\n    if (!a || !b) return false;\n    return Math.abs(a.row - b.row) + Math.abs(a.col - b.col) === 1;\n  }\n\n  // 临时交换检查是否会形成消除（不改动游戏状态）\n  wouldMatch(a, b) {\n    this.swapTiles(a, b);\n    const ok = this.findMatches().size > 0;\n    this.swapTiles(a, b);\n    return ok;\n  }\n\n  hasMove() {\n    const n = this.size;\n    for (let r = 0; r < n; r++) {\n      for (let c = 0; c < n; c++) {\n        if (c + 1 < n && this.wouldMatch(this.grid[r][c], this.grid[r][c + 1])) return true;\n        if (r + 1 < n && this.wouldMatch(this.grid[r][c], this.grid[r + 1][c])) return true;\n      }\n    }\n    return false;\n  }\n\n  findHint() {\n    const n = this.size;\n    for (let r = 0; r < n; r++) {\n      for (let c = 0; c < n; c++) {\n        if (c + 1 < n && this.wouldMatch(this.grid[r][c], this.grid[r][c + 1])) {\n          return [this.grid[r][c], this.grid[r][c + 1]];\n        }\n        if (r + 1 < n && this.wouldMatch(this.grid[r][c], this.grid[r + 1][c])) {\n          return [this.grid[r][c], this.grid[r + 1][c]];\n        }\n      }\n    }\n    return null;\n  }\n\n  // 重排现有棋子，保证有解且无现成三连；彩头标记跟随新的菜色\n  shuffle() {\n    const tiles = [];\n    this.each((t) => tiles.push(t));\n    for (let attempt = 0; attempt < 60; attempt++) {\n      const types = tiles.map((t) => t.type);\n      for (let i = types.length - 1; i > 0; i--) {\n        const j = Math.floor(Math.random() * (i + 1));\n        const tmp = types[i]; types[i] = types[j]; types[j] = tmp;\n      }\n      for (let i = 0; i < tiles.length; i++) {\n        tiles[i].type = types[i];\n        const isLuckyType = this.luckyTypes && this.luckyTypes.indexOf(types[i]) >= 0;\n        tiles[i].lucky = isLuckyType ? Math.random() < (this.luckyChance || 0.22) : false;\n      }\n      if (this.findMatches().size === 0 && this.hasMove()) return true;\n    }\n    this.reset();\n    if (this.luckyTypes) this.markLucky(this.luckyTypes, 0.22);\n    return true;\n  }\n\n  removeCleared() {\n    for (let r = 0; r < this.size; r++) {\n      for (let c = 0; c < this.size; c++) {\n        if (this.grid[r][c] && this.grid[r][c].clearing) this.grid[r][c] = null;\n      }\n    }\n  }\n\n  // 重力下落 + 顶部补新棋子；新棋子从棋盘上方落入\n  applyGravity() {\n    const n = this.size;\n    for (let c = 0; c < n; c++) {\n      let write = n - 1;\n      for (let r = n - 1; r >= 0; r--) {\n        const t = this.grid[r][c];\n        if (!t) continue;\n        if (write !== r) {\n          this.grid[write][c] = t;\n          this.grid[r][c] = null;\n          t.row = write;\n        }\n        write--;\n      }\n      const holes = write + 1;\n      for (let r = write; r >= 0; r--) {\n        const tile = new Tile(this.rndType(), r, c);\n        tile.py = r - holes;\n        tile.px = c;\n        tile.scale = 0.82;\n        if (this.luckyTypes && this.luckyTypes.indexOf(tile.type) >= 0) {\n          tile.lucky = Math.random() < (this.luckyChance || 0.22);\n        }\n        this.grid[r][c] = tile;\n      }\n    }\n  }\n\n  // 本局彩头菜：随机 3 种\n  pickLuckyTypes(count) {\n    const pool = [];\n    for (let i = 0; i < this.typeCount; i++) pool.push(i);\n    for (let i = pool.length - 1; i > 0; i--) {\n      const j = Math.floor(Math.random() * (i + 1));\n      const t = pool[i]; pool[i] = pool[j]; pool[j] = t;\n    }\n    return pool.slice(0, Math.min(count, pool.length)).sort((a, b) => a - b);\n  }\n\n  // 标记场上的彩头棋（按比例随机，新棋子生成时也调用）\n  markLucky(luckyTypes, chance) {\n    const rate = chance === undefined ? 0.22 : chance;\n    this.each((t) => {\n      if (luckyTypes.indexOf(t.type) >= 0 && Math.random() < rate) t.lucky = true;\n    });\n  }\n\n  randomLuckyOn(type, luckyTypes, chance) {\n    return luckyTypes.indexOf(type) >= 0 && Math.random() < (chance === undefined ? 0.22 : chance);\n  }\n}\n\nmodule.exports = { Board, Tile };\n',
 "js/render.js": '// Canvas 绘制层：所有界面都在这里画，不处理输入与状态。\nconst { TILES, ACHIEVEMENTS, rankOf } = require(\'./data.js\');\nconst leaderboard = require(\'./leaderboard.js\');\n\nconst TAU = Math.PI * 2;\nconst INK = \'#4a2f1b\';\nconst SUB = \'#a2805d\';\nconst CARD = \'#fffdf6\';\nconst CARD_EDGE = \'#efcfa2\';\nconst ACCENT = \'#ff8a3d\';\nconst ACCENT_DEEP = \'#e8621c\';\nconst GOLD = \'#ffc94d\';\nconst ON_BG = \'#ffffff\';\n\nfunction rgba(hex, a) {\n  const h = hex.replace(\'#\', \'\');\n  const n = parseInt(h.length === 3 ? h.split(\'\').map((c) => c + c).join(\'\') : h, 16);\n  return \'rgba(\' + ((n >> 16) & 255) + \',\' + ((n >> 8) & 255) + \',\' + (n & 255) + \',\' + a + \')\';\n}\n\nfunction pathRound(ctx, x, y, w, h, r) {\n  const rr = Math.max(0, Math.min(r, h / 2, w / 2));\n  ctx.beginPath();\n  ctx.moveTo(x + rr, y);\n  ctx.arcTo(x + w, y, x + w, y + h, rr);\n  ctx.arcTo(x + w, y + h, x, y + h, rr);\n  ctx.arcTo(x, y + h, x, y, rr);\n  ctx.arcTo(x, y, x + w, y, rr);\n  ctx.closePath();\n}\n\nclass Renderer {\n  constructor(canvas, ctx) {\n    this.canvas = canvas;\n    this.ctx = ctx;\n    this.bgGrad = null;\n    this.tileGrads = {};\n    this.W = 0;\n    this.H = 0;\n  }\n\n  setSize(W, H) {\n    if (this.W !== W || this.H !== H) {\n      this.W = W;\n      this.H = H;\n      this.bgGrad = null;\n      this.tileGrads = {};\n    }\n  }\n\n  text(str, x, y, opt) {\n    const ctx = this.ctx;\n    const o = opt || {};\n    ctx.font = (o.bold ? \'bold \' : \'\') + (o.size || 14) + \'px \' + (o.font || \'sans-serif\');\n    ctx.fillStyle = o.color || INK;\n    ctx.textAlign = o.align || \'left\';\n    ctx.textBaseline = o.baseline || \'alphabetic\';\n    if (o.alpha !== undefined) ctx.globalAlpha = o.alpha;\n    if (o.stroke) {\n      ctx.lineWidth = o.strokeWidth || 3;\n      ctx.strokeStyle = o.stroke;\n      ctx.lineJoin = \'round\';\n      ctx.strokeText(str, x, y);\n    }\n    ctx.fillText(str, x, y);\n    if (o.alpha !== undefined) ctx.globalAlpha = 1;\n  }\n\n  measure(str, size, bold) {\n    this.ctx.font = (bold ? \'bold \' : \'\') + size + \'px sans-serif\';\n    return this.ctx.measureText(str).width;\n  }\n\n  clip(str, maxWidth, size, bold) {\n    this.ctx.font = (bold ? \'bold \' : \'\') + size + \'px sans-serif\';\n    if (this.ctx.measureText(str).width <= maxWidth) return str;\n    let s = str;\n    while (s.length > 1 && this.ctx.measureText(s + \'…\').width > maxWidth) {\n      s = s.slice(0, -1);\n    }\n    return s + \'…\';\n  }\n\n  pill(x, y, w, h, r, fill, stroke) {\n    const ctx = this.ctx;\n    pathRound(ctx, x, y, w, h, r === undefined ? h / 2 : r);\n    if (fill) {\n      ctx.fillStyle = fill;\n      ctx.fill();\n    }\n    if (stroke) {\n      ctx.lineWidth = 1;\n      ctx.strokeStyle = stroke;\n      ctx.stroke();\n    }\n  }\n\n  // 带白边与投影的卡片\n  card(x, y, w, h, r, fill, edge, edgeW, u) {\n    const ctx = this.ctx;\n    ctx.save();\n    ctx.shadowColor = \'rgba(52,42,12,0.22)\';\n    ctx.shadowBlur = 12 * u;\n    ctx.shadowOffsetY = 5 * u;\n    pathRound(ctx, x, y, w, h, r);\n    ctx.fillStyle = fill || CARD;\n    ctx.fill();\n    ctx.restore();\n    if (edge) {\n      pathRound(ctx, x, y, w, h, r);\n      ctx.lineWidth = edgeW || 2 * u;\n      ctx.strokeStyle = edge;\n      ctx.stroke();\n    }\n  }\n\n  // 3D 立体按钮（下沉厚度 + 高光）\n  button(x, y, w, h, r, c1, c2, label, fs, u, textColor, strokeColor) {\n    const ctx = this.ctx;\n    pathRound(ctx, x, y + 5 * u, w, h, r);\n    ctx.fillStyle = c2;\n    ctx.fill();\n\n    const gr = ctx.createLinearGradient(0, y, 0, y + h);\n    gr.addColorStop(0, c1);\n    gr.addColorStop(1, c2);\n    pathRound(ctx, x, y, w, h, r);\n    ctx.fillStyle = gr;\n    ctx.fill();\n    ctx.lineWidth = 2 * u;\n    ctx.strokeStyle = \'rgba(255,255,255,0.5)\';\n    ctx.stroke();\n\n    ctx.save();\n    pathRound(ctx, x, y, w, h, r);\n    ctx.clip();\n    const hl = ctx.createLinearGradient(0, y, 0, y + h * 0.6);\n    hl.addColorStop(0, \'rgba(255,255,255,0.45)\');\n    hl.addColorStop(1, \'rgba(255,255,255,0)\');\n    ctx.fillStyle = hl;\n    ctx.fillRect(x, y, w, h * 0.6);\n    ctx.restore();\n\n    this.text(label, x + w / 2, y + h / 2 + 1 * u, {\n      size: fs, bold: true, align: \'center\', baseline: \'middle\',\n      color: textColor || \'#ffffff\',\n      stroke: strokeColor === null ? null : (strokeColor || \'rgba(146,58,10,0.55)\'),\n      strokeWidth: 3 * u\n    });\n  }\n\n  // 缎带标题\n  ribbon(cx, y, w, h, label, fs, u, c1, c2) {\n    const ctx = this.ctx;\n    const x = cx - w / 2;\n    const tail = 10 * u;\n\n    ctx.fillStyle = c2;\n    pathRound(ctx, x - tail, y + 6 * u, tail + 6 * u, h * 0.72, 4 * u);\n    ctx.fill();\n    pathRound(ctx, x + w - 6 * u, y + 6 * u, tail + 6 * u, h * 0.72, 4 * u);\n    ctx.fill();\n\n    const gr = ctx.createLinearGradient(0, y, 0, y + h);\n    gr.addColorStop(0, c1);\n    gr.addColorStop(1, c2);\n    pathRound(ctx, x, y, w, h, h * 0.32);\n    ctx.fillStyle = gr;\n    ctx.fill();\n    ctx.lineWidth = 2.5 * u;\n    ctx.strokeStyle = \'rgba(255,255,255,0.6)\';\n    ctx.stroke();\n\n    this.text(label, cx, y + h / 2 + 1 * u, {\n      size: fs, bold: true, align: \'center\', baseline: \'middle\', color: \'#ffffff\',\n      stroke: \'rgba(150,55,10,0.6)\', strokeWidth: 4 * u\n    });\n  }\n\n  hit(g, x, y, w, h, id) {\n    g.hit.push({ x, y, w, h, id });\n  }\n\n  // ---------------- 背景 ----------------\n  drawBackground(g) {\n    const ctx = this.ctx;\n    const W = this.W;\n    const H = this.H;\n    if (!this.bgGrad) {\n      const gg = ctx.createLinearGradient(0, 0, 0, H);\n      gg.addColorStop(0, \'#8fdc7a\');\n      gg.addColorStop(0.38, \'#5dc46b\');\n      gg.addColorStop(1, \'#2f9a55\');\n      this.bgGrad = gg;\n    }\n    ctx.fillStyle = this.bgGrad;\n    ctx.fillRect(0, 0, W, H);\n\n    // 顶部阳光\n    const sun = ctx.createRadialGradient(W * 0.5, -H * 0.16, 10, W * 0.5, -H * 0.16, W * 1.15);\n    sun.addColorStop(0, \'rgba(255,251,186,0.62)\');\n    sun.addColorStop(0.5, \'rgba(255,245,160,0.18)\');\n    sun.addColorStop(1, \'rgba(255,245,160,0)\');\n    ctx.fillStyle = sun;\n    ctx.fillRect(0, 0, W, H * 0.75);\n\n    // 光芒\n    ctx.save();\n    ctx.globalAlpha = 0.07;\n    ctx.fillStyle = \'#ffffff\';\n    const cx = W * 0.5;\n    const cy = -H * 0.12;\n    for (let i = 0; i < 10; i++) {\n      const a = (i / 10) * TAU + 0.15;\n      ctx.beginPath();\n      ctx.moveTo(cx, cy);\n      ctx.arc(cx, cy, W * 1.5, a, a + 0.15);\n      ctx.closePath();\n      ctx.fill();\n    }\n    ctx.restore();\n\n    // 光斑\n    const spots = [[0.13, 0.24, 46], [0.87, 0.18, 34], [0.76, 0.62, 58], [0.2, 0.78, 40], [0.55, 0.92, 30]];\n    for (let i = 0; i < spots.length; i++) {\n      const s = spots[i];\n      ctx.beginPath();\n      ctx.arc(W * s[0], H * s[1], s[2] * (W / 390), 0, TAU);\n      ctx.fillStyle = \'rgba(255,255,255,0.055)\';\n      ctx.fill();\n    }\n\n    // 底部草地压暗，突出层次\n    const foot = ctx.createLinearGradient(0, H - H * 0.22, 0, H);\n    foot.addColorStop(0, \'rgba(24,96,48,0)\');\n    foot.addColorStop(1, \'rgba(20,88,44,0.35)\');\n    ctx.fillStyle = foot;\n    ctx.fillRect(0, H - H * 0.22, W, H * 0.22);\n\n    // 对局时背景飘一点食材，画面更活\n    if (g.state !== \'menu\') {\n      const u = W / 375;\n      const drift = [\n        [0.045, 0.28, \'🥬\', 26], [0.95, 0.36, \'🍋\', 22],\n        [0.055, 0.6, \'🌶️\', 20], [0.94, 0.68, \'🥢\', 22]\n      ];\n      const tick = Date.now();\n      for (let i = 0; i < drift.length; i++) {\n        const d = drift[i];\n        const yy = H * d[1] + Math.sin(tick / 2400 + i * 1.7) * 10 * u;\n        ctx.globalAlpha = 0.13;\n        this.text(d[2], W * d[0], yy, { size: d[3] * u, align: \'center\', baseline: \'middle\' });\n        ctx.globalAlpha = 1;\n      }\n    }\n  }\n\n  // ---------------- 顶部信息 ----------------\n  // 左上角昵称胶囊（菜单与对局共用）\n  drawUserChip(g) {\n    const ctx = this.ctx;\n    const L = g.L;\n    const u = g.u;\n    const chipH = L.brandH;\n    const nameText = g.displayName();\n    const nameW = Math.min(this.measure(nameText, 12 * u, true) + 36 * u, this.W * 0.42);\n    this.card(L.pad, L.brandY, nameW, chipH, chipH / 2, \'rgba(255,252,240,0.94)\', \'rgba(255,255,255,0.85)\', 2 * u, u);\n    this.text(\'👨‍🍳\', L.pad + 10 * u, L.brandY + chipH / 2 + 0.5, { size: 13 * u, align: \'left\', baseline: \'middle\' });\n    ctx.save();\n    ctx.beginPath();\n    ctx.rect(L.pad + 26 * u, L.brandY, nameW - 32 * u, chipH);\n    ctx.clip();\n    this.text(nameText, L.pad + 27 * u, L.brandY + chipH / 2 + 0.5, {\n      size: 12 * u, bold: true, color: \'#7a5330\', baseline: \'middle\'\n    });\n    ctx.restore();\n    this.hit(g, L.pad, L.brandY, nameW, chipH, \'name\');\n  }\n\n  drawHeader(g) {\n    const ctx = this.ctx;\n    const L = g.L;\n    const u = g.u;\n\n    // 昵称\n    this.drawUserChip(g);\n\n    // 右侧两个按钮\n    const btnH = L.brandH;\n    const achW = 60 * u;\n    const rankW = 60 * u;\n    const gap = 8 * u;\n    const achX = this.W - L.pad - achW;\n    const rankX = achX - gap - rankW;\n\n    const ghost = (x, label, id) => {\n      this.card(x, L.brandY, rankW, btnH, btnH / 2, \'rgba(255,250,236,0.9)\', \'rgba(255,255,255,0.8)\', 2 * u, u);\n      this.text(label, x + rankW / 2, L.brandY + btnH / 2 + 0.5, {\n        size: 11 * u, bold: true, align: \'center\', baseline: \'middle\', color: \'#a1652c\'\n      });\n      this.hit(g, x, L.brandY, rankW, btnH, id);\n    };\n    ghost(rankX, \'🏆 榜单\', \'rank\');\n    ghost(achX, \'🏅 成就\', \'achv\');\n\n    // 分数\n    this.text(\'本局得分\', L.pad + 2 * u, L.scoreY + 13 * u, {\n      size: 10 * u, bold: true, color: ON_BG, stroke: \'rgba(30,86,38,0.55)\', strokeWidth: 1.6 * u\n    });\n    this.text(String(g.run.score), L.pad, L.scoreY + 46 * u, {\n      size: 33 * u, bold: true, color: \'#ffffff\', stroke: \'rgba(122,64,18,0.8)\', strokeWidth: 3.6 * u\n    });\n    if (g.run.score > g.stats.best && g.run.score > 0) {\n      const sw = this.measure(String(g.run.score), 33 * u, true);\n      this.text(\'新纪录\', L.pad + sw + 8 * u, L.scoreY + 43 * u, {\n        size: 9 * u, bold: true, color: \'#fff3b0\', stroke: \'rgba(122,64,18,0.6)\', strokeWidth: 2.5 * u\n      });\n    }\n\n    // 右侧：剩余步数 + 倒计时\n    const cardW2 = 76 * u;\n    const cardGap = 6 * u;\n    const th = 46 * u;\n    const ty = L.scoreY + (L.scoreH - th) / 2;\n    const timerX = this.W - L.pad - cardW2;\n    const stepsX = timerX - cardGap - cardW2;\n\n    // 剩余步数（20 步上限）\n    const movesLeft = Math.max(0, g.run.moves || 0);\n    const lowMoves = movesLeft <= 5;\n    const mpulse = lowMoves ? 0.5 + 0.5 * Math.sin(Date.now() / 160) : 0;\n    this.card(stepsX, ty, cardW2, th, 16 * u,\n      lowMoves ? \'#ffe7d8\' : \'rgba(255,252,240,0.96)\',\n      lowMoves ? \'rgba(255,120,80,\' + (0.55 + mpulse * 0.4) + \')\' : \'rgba(255,255,255,0.9)\', 2.5 * u, u);\n    this.text(\'👣\', stepsX + 13 * u, ty + th / 2 + 1, {\n      size: 13 * u, align: \'center\', baseline: \'middle\'\n    });\n    this.text(String(movesLeft), stepsX + cardW2 - 24 * u, ty + th / 2 + 2 * u, {\n      size: 24 * u, bold: true, align: \'right\', baseline: \'middle\',\n      color: lowMoves ? \'#e33b16\' : \'#5c3b1e\'\n    });\n    this.text(\'步\', stepsX + cardW2 - 9 * u, ty + th / 2 + 5 * u, {\n      size: 10 * u, bold: true, color: SUB, baseline: \'middle\', align: \'right\'\n    });\n\n    // 倒计时\n    const danger = g.run.time <= 10;\n    const pulse = danger ? 0.5 + 0.5 * Math.sin(Date.now() / 160) : 0;\n\n    this.card(timerX, ty, cardW2, th, 16 * u,\n      danger ? \'#ffe7d8\' : \'rgba(255,252,240,0.96)\',\n      danger ? \'rgba(255,120,80,\' + (0.55 + pulse * 0.4) + \')\' : \'rgba(255,255,255,0.9)\', 2.5 * u, u);\n    this.text(\'⏱\', timerX + 13 * u, ty + th / 2 + 1, { size: 13 * u, align: \'center\', baseline: \'middle\' });\n    this.text(String(Math.max(0, Math.ceil(g.run.time))), timerX + cardW2 - 21 * u, ty + th / 2 + 2 * u, {\n      size: 21 * u, bold: true, align: \'right\', baseline: \'middle\',\n      color: danger ? \'#e33b16\' : \'#5c3b1e\'\n    });\n    this.text(\'s\', timerX + cardW2 - 9 * u, ty + th / 2 + 5 * u, {\n      size: 9.5 * u, bold: true, color: SUB, baseline: \'middle\', align: \'right\'\n    });\n\n    // 时间条\n    const barW = this.W - L.pad * 2;\n    const barR = L.barH / 2;\n    this.pill(L.pad, L.barY, barW, L.barH, barR, \'rgba(22,78,40,0.28)\');\n    const ratio = Math.max(0, Math.min(1, g.run.time / g.run.roundSeconds));\n    if (ratio > 0) {\n      const fw = Math.max(L.barH, barW * ratio);\n      const bg2 = ctx.createLinearGradient(L.pad, 0, L.pad + fw, 0);\n      if (danger) {\n        bg2.addColorStop(0, \'#ff7a4d\');\n        bg2.addColorStop(1, \'#ff3d24\');\n      } else {\n        bg2.addColorStop(0, \'#ffe07a\');\n        bg2.addColorStop(1, \'#ffa42e\');\n      }\n      this.pill(L.pad, L.barY, fw, L.barH, barR, bg2);\n      this.pill(L.pad + 2 * u, L.barY + 1.5 * u, Math.max(2, fw - 4 * u), L.barH * 0.34, L.barH * 0.2, \'rgba(255,255,255,0.45)\');\n    }\n  }\n\n  drawHeatAndLucky(g) {\n    const ctx = this.ctx;\n    const L = g.L;\n    const u = g.u;\n    const h = L.heatH;\n    const rightW = 3 * 30 * u + 2 * 5 * u;\n    const cardW = this.W - L.pad * 2 - rightW - 12 * u;\n    const y = L.heatY;\n\n    this.card(L.pad, y, cardW, h, h / 2, \'rgba(255,252,240,0.94)\', \'rgba(255,255,255,0.8)\', 2 * u, u);\n    this.text(\'🔥 锅气\', L.pad + 12 * u, y + h / 2 + 0.5, {\n      size: 10.5 * u, bold: true, color: \'#b8632c\', baseline: \'middle\'\n    });\n\n    const barX = L.pad + 54 * u;\n    const barW = cardW - 54 * u - 38 * u;\n    const segGap = 3.5 * u;\n    const segW = (barW - segGap * 4) / 5;\n    for (let i = 0; i < 5; i++) {\n      const on = i < g.run.heat;\n      const x = barX + i * (segW + segGap);\n      const sy = y + h / 2 - 5 * u;\n      const sh = 10 * u;\n      if (!on) {\n        this.pill(x, sy, segW, sh, sh / 2, \'rgba(196,170,140,0.35)\');\n      } else {\n        const gg = ctx.createLinearGradient(x, sy, x, sy + sh);\n        if (g.run.heat >= 5) {\n          gg.addColorStop(0, \'#ffc24a\');\n          gg.addColorStop(1, \'#e8461b\');\n        } else {\n          gg.addColorStop(0, \'#ffd98a\');\n          gg.addColorStop(1, \'#f08a2e\');\n        }\n        this.pill(x, sy, segW, sh, sh / 2, gg);\n        this.pill(x + 1.5 * u, sy + 1.5 * u, segW - 3 * u, sh * 0.3, sh * 0.15, \'rgba(255,255,255,0.5)\');\n      }\n    }\n    this.text(\'×\' + (1 + g.run.heat * 0.1).toFixed(1), L.pad + cardW - 9 * u, y + h / 2 + 0.5, {\n      size: 10.5 * u, bold: true, color: g.run.heat >= 3 ? \'#e2591f\' : \'#b99a78\',\n      align: \'right\', baseline: \'middle\'\n    });\n\n    for (let i = 0; i < g.run.luckyTypes.length; i++) {\n      const type = g.run.luckyTypes[i];\n      const T = TILES[type];\n      const cx = this.W - L.pad - rightW + 15 * u + i * (30 * u + 5 * u);\n      const cy = y + h / 2;\n      const rr = 14.5 * u;\n      ctx.beginPath();\n      ctx.arc(cx, cy + 1.5 * u, rr, 0, TAU);\n      ctx.fillStyle = \'rgba(40,70,30,0.16)\';\n      ctx.fill();\n      ctx.beginPath();\n      ctx.arc(cx, cy, rr, 0, TAU);\n      ctx.fillStyle = \'#fffdf3\';\n      ctx.fill();\n      ctx.lineWidth = 2.5 * u;\n      ctx.strokeStyle = T.color;\n      ctx.stroke();\n      this.text(T.emoji, cx, cy + 0.5, { size: 14 * u, align: \'center\', baseline: \'middle\' });\n    }\n  }\n\n  // ---------------- 棋盘 ----------------\n  drawBoard(g) {\n    const ctx = this.ctx;\n    const L = g.L;\n    const u = g.u;\n    const b = g.board;\n    const bx = L.boardX;\n    const by = L.boardTop;\n    const bs = L.boardSize;\n\n    // 木框投影\n    ctx.save();\n    ctx.shadowColor = \'rgba(30,62,20,0.32)\';\n    ctx.shadowBlur = 16 * u;\n    ctx.shadowOffsetY = 8 * u;\n    pathRound(ctx, bx, by, bs, bs, 26 * u);\n    ctx.fillStyle = \'#c4853f\';\n    ctx.fill();\n    ctx.restore();\n\n    // 木质外框\n    const wood = ctx.createLinearGradient(0, by, 0, by + bs);\n    wood.addColorStop(0, \'#e9b877\');\n    wood.addColorStop(0.5, \'#d29850\');\n    wood.addColorStop(1, \'#b9772f\');\n    pathRound(ctx, bx, by, bs, bs, 26 * u);\n    ctx.fillStyle = wood;\n    ctx.fill();\n    ctx.lineWidth = 3 * u;\n    ctx.strokeStyle = \'#8f5a26\';\n    ctx.stroke();\n    pathRound(ctx, bx + 3.5 * u, by + 3.5 * u, bs - 7 * u, bs - 7 * u, 23 * u);\n    ctx.lineWidth = 2 * u;\n    ctx.strokeStyle = \'rgba(255,236,196,0.55)\';\n    ctx.stroke();\n\n    // 木框顶部高光（糖果质感）\n    ctx.save();\n    pathRound(ctx, bx, by, bs, bs, 26 * u);\n    ctx.clip();\n    const hl = ctx.createLinearGradient(0, by, 0, by + bs * 0.35);\n    hl.addColorStop(0, \'rgba(255,255,255,0.35)\');\n    hl.addColorStop(1, \'rgba(255,255,255,0)\');\n    ctx.fillStyle = hl;\n    ctx.fillRect(bx, by, bs, bs * 0.35);\n    ctx.restore();\n\n    // 内嵌面板\n    const inset = L.inner;\n    const pp = 4 * u;\n    pathRound(ctx, bx + inset - pp, by + inset - pp,\n      bs - 2 * inset + 2 * pp, bs - 2 * inset + 2 * pp, 16 * u);\n    ctx.fillStyle = \'#fdf0d9\';\n    ctx.fill();\n    ctx.lineWidth = 1.5 * u;\n    ctx.strokeStyle = \'rgba(143,90,38,0.22)\';\n    ctx.stroke();\n\n    // 格子底纹\n    for (let r = 0; r < b.size; r++) {\n      for (let c = 0; c < b.size; c++) {\n        const x = L.bx + c * L.cell;\n        const y = L.by + r * L.cell;\n        pathRound(ctx, x + 1.5 * u, y + 1.5 * u, L.cell - 3 * u, L.cell - 3 * u, 9 * u);\n        ctx.fillStyle = (r + c) % 2 ? \'rgba(255,224,176,0.35)\' : \'rgba(255,238,206,0.55)\';\n        ctx.fill();\n      }\n    }\n\n    // 提示高亮\n    if (g.hintPair) {\n      const t = (Date.now() % 900) / 900;\n      const alpha = 0.3 + 0.6 * (1 - Math.abs(t * 2 - 1));\n      for (let i = 0; i < 2; i++) {\n        const tile = g.hintPair[i];\n        if (!tile) continue;\n        const x = L.bx + (tile.px + 0.5) * L.cell;\n        const y = L.by + (tile.py + 0.5) * L.cell;\n        ctx.beginPath();\n        ctx.arc(x, y, L.cell * 0.47, 0, TAU);\n        ctx.lineWidth = 3 * u;\n        ctx.strokeStyle = \'rgba(255,242,130,\' + alpha + \')\';\n
