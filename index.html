        });\n      }\n\n      this.text(this.clip(item.name, w - 100 * u, 12.5 * u), x + 36 * u, cyy + 1, {\n        size: 12.5 * u, bold: isMe, baseline: \'middle\', color: isMe ? \'#b8491a\' : \'#5b402c\'\n      });\n      this.text(String(item.score), x + w - 12 * u, cyy + 1, {\n        size: 14 * u, bold: true, align: \'right\', baseline: \'middle\', color: isMe ? \'#e2591f\' : \'#8a5a2e\'\n      });\n    };\n\n    // 像素级平移 + 裁剪，滑动更顺滑（支持惯性中的小数偏移）\n    ctx.save();\n    ctx.beginPath();\n    ctx.rect(x - 6 * u, y - 2 * u, w + 12 * u, listRows * rowH + 4 * u);\n    ctx.clip();\n    const lastIdx = Math.min(view.list.length - 1, start + listRows);\n    for (let i = start; i <= lastIdx; i++) {\n      drawRow(i, y + (i - start) * rowH - frac * rowH, i % 2 === 1);\n    }\n    ctx.restore();\n\n    if (pinMe) {\n      const ry = y + listRows * rowH;\n      this.text(\'· · ·\', x + w / 2, ry + 1.5 * u, {\n        size: 9 * u, align: \'center\', baseline: \'middle\', color: \'#cdb9a6\'\n      });\n      drawRow(myIdx, ry + 6 * u, false);\n    }\n\n    if (!view.list.length) {\n      this.text(\'还没有人上榜，做第一个吧\', x + w / 2, y + h / 2, {\n        size: 12 * u, align: \'center\', color: \'#b39a86\'\n      });\n    }\n\n    // 滚动条：列表超出可视区域时显示，提示可上下拖动\n    if (view.maxScroll > 0) {\n      const trackX = x + w + 6 * u;\n      const trackW = 3.5 * u;\n      const trackH = Math.max(listRows, 1) * rowH;\n      const thumbH = Math.max(22 * u, trackH * (maxRows / view.list.length));\n      const ratio = Math.max(0, Math.min(1, view.maxScroll ? scroll / view.maxScroll : 0));\n      const thumbY = y + (trackH - thumbH) * ratio;\n      ctx.fillStyle = \'rgba(200,170,140,0.22)\';\n      pathRound(ctx, trackX, y, trackW, trackH, trackW / 2);\n      ctx.fill();\n      ctx.fillStyle = \'rgba(240,129,47,0.8)\';\n      pathRound(ctx, trackX, thumbY, trackW, thumbH, trackW / 2);\n      ctx.fill();\n    }\n  }\n\n  drawFriendList(g, x, y, w, h) {\n    const ctx = this.ctx;\n    const u = g.u;\n    const fm = leaderboard.friendMetrics(h);\n    g.rankView.rowH = fm.rowH;\n    g.rankView.maxScroll = fm.maxScroll;\n    leaderboard.prepareFriendRank(w, h, 2, g.rankView.scroll || 0);\n    const c = leaderboard.friendCanvas();\n    if (c) {\n      try {\n        ctx.drawImage(c, x, y, w, h);\n        return;\n      } catch (e) { /* 降级到文字提示 */ }\n    }\n    this.text(\'好友榜需在微信小游戏中查看\', x + w / 2, y + h / 2 - 8 * u, {\n      size: 12 * u, align: \'center\', color: \'#b39a86\'\n    });\n  }\n\n  // ---------------- 成就 ----------------\n  drawAchievements(g) {\n    const ctx = this.ctx;\n    const u = g.u;\n    const pw = Math.min(342 * u, this.W - 32 * u);\n    const ph = Math.min(this.H - g.safeTop - g.safeBottom - 60 * u, 468 * u);\n    const px = (this.W - pw) / 2;\n    const py = g.safeTop + (this.H - g.safeTop - g.safeBottom - ph) / 2;\n\n    this.dimBackdrop(g);\n    this.card(px, py, pw, ph, 24 * u, CARD, \'#e4a95f\', 7 * u, u);\n    this.ribbon(this.W / 2, py + 8 * u, pw * 0.58, 42 * u, \'🏅 成 就 墙\', 17 * u, u, \'#ffb45c\', \'#f0812f\');\n\n    const unlocked = g.stats.unlocked;\n    this.text(unlocked.length + \' / \' + ACHIEVEMENTS.length, px + pw - 46 * u, py + 66 * u, {\n      size: 12 * u, bold: true, align: \'right\', color: \'#b08a68\'\n    });\n    this.closeBtn(g, px + pw - 24 * u, py + 26 * u, u);\n\n    const cols = 4;\n    const cellW = (pw - 32 * u) / cols;\n    const rows = Math.ceil(ACHIEVEMENTS.length / cols);\n    const gridTop = py + 80 * u;\n    const cellH = Math.min(72 * u, (ph - 96 * u) / rows);\n    const seal = Math.min(cellW * 0.54, cellH * 0.56);\n\n    for (let i = 0; i < ACHIEVEMENTS.length; i++) {\n      const a = ACHIEVEMENTS[i];\n      const col = i % cols;\n      const row = Math.floor(i / cols);\n      const cx = px + 16 * u + col * cellW + cellW / 2;\n      const cy = gridTop + row * cellH + seal / 2;\n      const on = unlocked.indexOf(a.id) >= 0;\n\n      // 已点亮的成就：外围环绕跳动的火焰框\n      if (on) this.flameFrame(cx, cy, seal, u);\n\n      ctx.save();\n      pathRound(ctx, cx - seal / 2, cy - seal / 2, seal, seal, 9 * u);\n      if (on) {\n        const gr = ctx.createLinearGradient(0, cy - seal / 2, 0, cy + seal / 2);\n        gr.addColorStop(0, \'#e0503a\');\n        gr.addColorStop(1, \'#a8281c\');\n        ctx.fillStyle = gr;\n        ctx.fill();\n        ctx.lineWidth = 2 * u;\n        ctx.strokeStyle = \'rgba(255,220,170,0.7)\';\n        ctx.stroke();\n      } else {\n        ctx.fillStyle = \'#f2e4d2\';\n        ctx.fill();\n        ctx.lineWidth = 2 * u;\n        ctx.strokeStyle = \'#e3cfb4\';\n        ctx.stroke();\n      }\n      this.text(on ? a.seal : \'？\', cx, cy + 1 * u, {\n        size: seal * 0.55, bold: true, align: \'center\', baseline: \'middle\',\n        color: on ? \'#ffe9cf\' : \'#c2a888\'\n      });\n      ctx.restore();\n\n      this.text(a.name, cx, cy + seal / 2 + 12 * u, {\n        size: 9.5 * u, bold: on, align: \'center\', color: on ? \'#7b5236\' : \'#c2ac98\'\n      });\n      this.text(this.clip(a.desc, cellW - 6 * u, 8 * u), cx, cy + seal / 2 + 23 * u, {\n        size: 8 * u, align: \'center\', color: on ? \'#b1907a\' : \'#d3c2b2\'\n      });\n\n      // 点击查看成就条件\n      g.hit.push({ x: cx - cellW / 2, y: cy - seal / 2 - 4 * u, w: cellW, h: cellH, id: \'achv_detail_\' + a.id });\n    }\n  }\n\n  // 已点亮成就：外围环绕燃烧的红色火焰框（持续动画）\n  flameFrame(cx, cy, size, u) {\n    const ctx = this.ctx;\n    const t = Date.now();\n    const half = size / 2;\n    const N = 18;\n\n    // 红色外发光：呼吸脉动，先把轮廓拉开\n    ctx.save();\n    const halo = 0.5 + 0.5 * Math.sin(t / 220);\n    ctx.shadowColor = \'rgba(255,40,0,1)\';\n    ctx.shadowBlur = (18 + 14 * halo) * u;\n    ctx.lineWidth = (4 + 2 * halo) * u;\n    ctx.strokeStyle = \'rgba(255,55,0,0.95)\';\n    pathRound(ctx, cx - half, cy - half, size, size, 10 * u);\n    ctx.stroke();\n    ctx.restore();\n\n    // 火舌：红底 + 橙黄火心，火苗整体向上飘\n    ctx.save();\n    for (let i = 0; i < N; i++) {\n      const baseAng = (i / N) * TAU;\n      const sway = Math.sin(t / 560 + i * 0.8) * 0.13 + Math.sin(t / 190 + i * 2.3) * 0.05;\n      const ang = baseAng + sway;\n      const wave = Math.sin(t / 115 + i * 1.7);\n      const flick = 0.5 + 0.5 * wave;\n      const ca = Math.cos(ang);\n      const sa = Math.sin(ang);\n      // 下方火苗稍短，避免盖住成就名；上方更旺\n      const upness = 0.62 + 0.38 * (0.5 - 0.5 * sa);\n      const len = size * (0.30 + 0.30 * flick) * upness;\n      const px = cx + ca * half * 0.92;\n      const py = cy + sa * half * 0.92;\n      const tipX = px + ca * len + Math.sin(t / 220 + i * 1.3) * len * 0.30;\n      const tipY = py + sa * len + Math.cos(t / 260 + i * 1.1) * len * 0.30;\n      const nx = -sa;\n      const ny = ca;\n      const wgt = size * (0.10 + 0.07 * flick);\n\n      ctx.globalAlpha = 0.9 + 0.1 * flick;\n      // 外焰：正红 / 橘红交替\n      ctx.beginPath();\n      ctx.moveTo(px + nx * wgt, py + ny * wgt);\n      ctx.quadraticCurveTo(tipX + nx * wgt * 0.4, tipY + ny * wgt * 0.4, tipX, tipY);\n      ctx.quadraticCurveTo(tipX - nx * wgt * 0.4, tipY - ny * wgt * 0.4, px - nx * wgt, py - ny * wgt);\n      ctx.closePath();\n      ctx.fillStyle = i % 2 ? \'rgba(235,22,0,0.97)\' : \'rgba(255,80,0,0.97)\';\n      ctx.fill();\n\n      // 内焰：橙黄火心\n      const wgt2 = wgt * 0.44;\n      const len2 = len * (0.5 + 0.2 * flick);\n      const tx2 = px + ca * len2;\n      const ty2 = py + sa * len2;\n      ctx.beginPath();\n      ctx.moveTo(px + nx * wgt2, py + ny * wgt2);\n      ctx.quadraticCurveTo(tx2, ty2, px - nx * wgt2, py - ny * wgt2);\n      ctx.closePath();\n      ctx.fillStyle = \'rgba(255,190,40,1)\';\n      ctx.fill();\n    }\n    ctx.restore();\n\n    // 贴边亮黄火线：把火焰和红色印章明显分开\n    ctx.save();\n    const ring = 0.5 + 0.5 * Math.sin(t / 150 + 1.2);\n    ctx.shadowColor = \'rgba(255,120,0,1)\';\n    ctx.shadowBlur = (10 + 6 * ring) * u;\n    ctx.lineWidth = (3.2 + 1.2 * ring) * u;\n    ctx.strokeStyle = \'rgba(255,214,80,1)\';\n    pathRound(ctx, cx - half + 1 * u, cy - half + 1 * u, size - 2 * u, size - 2 * u, 8 * u);\n    ctx.stroke();\n    ctx.restore();\n  }\n\n  // ---------------- 广告弹层（看广告获得道具次数） ----------------\n  drawAdDialog(g) {\n    const u = g.u;\n    const item = g.adItem;\n    const label = item === \'hint\' ? \'提示\' : \'重排\';\n    const w = this.W * 0.8;\n    const h = 180 * u;\n    const x = (this.W - w) / 2;\n    const y = (this.H - h) / 2;\n    const ctx = this.ctx;\n\n    this.dimBackdrop(g);\n    ctx.save();\n    ctx.shadowColor = \'rgba(0,0,0,0.3)\';\n    ctx.shadowBlur = 20 * u;\n    pathRound(ctx, x, y, w, h, 18 * u);\n    ctx.fillStyle = \'#fffaf0\';\n    ctx.fill();\n    ctx.shadowBlur = 0;\n    ctx.strokeStyle = \'#ffd34d\';\n    ctx.lineWidth = 3 * u;\n    ctx.stroke();\n    ctx.restore();\n\n    this.text(\'次数已用完\', this.W / 2, y + 42 * u, {\n      size: 18 * u, bold: true, align: \'center\', color: \'#7b3f1a\'\n    });\n    this.text(\'看一段广告，获得 1 次\' + label, this.W / 2, y + 72 * u, {\n      size: 13 * u, align: \'center\', color: \'#9a6a3a\'\n    });\n\n    // 取消按钮\n    const btnW = w * 0.4;\n    const btnH = 40 * u;\n    const btnY = y + h - 60 * u;\n    const cx = x + w / 2;\n    pathRound(ctx, cx - btnW - 8 * u, btnY, btnW, btnH, 20 * u);\n    ctx.fillStyle = \'#e8e2d6\';\n    ctx.fill();\n    this.text(\'取消\', cx - btnW / 2 - 8 * u, btnY + btnH / 2, {\n      size: 14 * u, bold: true, align: \'center\', baseline: \'middle\', color: \'#8a7a66\'\n    });\n    g.hit.push({ x: cx - btnW - 8 * u, y: btnY, w: btnW, h: btnH, id: \'close\' });\n\n    // 看广告按钮\n    const gr = ctx.createLinearGradient(0, btnY, 0, btnY + btnH);\n    gr.addColorStop(0, \'#ffb347\');\n    gr.addColorStop(1, \'#ff7a18\');\n    pathRound(ctx, cx + 8 * u, btnY, btnW, btnH, 20 * u);\n    ctx.fillStyle = gr;\n    ctx.fill();\n    this.text(\'📺 看广告\', cx + btnW / 2 + 8 * u, btnY + btnH / 2, {\n      size: 14 * u, bold: true, align: \'center\', baseline: \'middle\', color: \'#fff\'\n    });\n    g.hit.push({ x: cx + 8 * u, y: btnY, w: btnW, h: btnH, id: \'ad_confirm\' });\n  }\n\n  // ---------------- 结算提示 / Toast ----------------\n  drawToasts(g) {\n    const u = g.u;\n    if (g.overlay) return;\n    for (let i = 0; i < g.toasts.length; i++) {\n      const t = g.toasts[i];\n      const k = Math.min(1, t.life / 220);\n      const w = this.measure(t.text, 11.5 * u, true) + 32 * u;\n      const x = (this.W - w) / 2;\n      const y = g.safeTop + 74 * u + i * 38 * u;\n      this.ctx.globalAlpha = k;\n      this.pill(x, y + 3 * u, w, 30 * u, 15 * u, \'rgba(20,60,30,0.25)\');\n      this.pill(x, y, w, 30 * u, 15 * u, \'rgba(60,38,18,0.9)\');\n      this.text(t.text, this.W / 2, y + 15.5 * u, {\n        size: 11.5 * u, bold: true, align: \'center\', baseline: \'middle\', color: \'#ffe9c9\'\n      });\n      this.ctx.globalAlpha = 1;\n    }\n  }\n\n  // ---------------- 总入口 ----------------\n  render(g) {\n    const ctx = this.ctx;\n    this.setSize(g.W, g.H);\n    ctx.setTransform(g.dpr, 0, 0, g.dpr, 0, 0);\n    ctx.clearRect(0, 0, g.W, g.H);\n\n    const shake = g.effects.shake;\n    ctx.save();\n    if (shake > 0.2) {\n      ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);\n    }\n\n    this.drawBackground(g);\n\n    if (g.state === \'menu\') {\n      this.drawMenu(g);\n    } else {\n      this.drawHeader(g);\n      this.drawHeatAndLucky(g);\n      this.drawBoard(g);\n      this.drawItems(g);\n      this.drawLegend(g);\n    }\n    this.drawEffects(g);\n    ctx.restore();\n\n    // 弹层打开时，屏蔽底层按钮的点击区，避免误触\n    if (g.overlay) g.hit.length = 0;\n\n    if (g.overlay === \'result\') this.drawResult(g);\n    else if (g.overlay === \'rank\') this.drawRank(g);\n    else if (g.overlay === \'achv\') this.drawAchievements(g);\n    else if (g.overlay === \'ad\') this.drawAdDialog(g);\n\n    this.drawToasts(g);\n  }\n}\n\nmodule.exports = { Renderer };\n',
 "js/leaderboard.js": '// 排行榜：全服榜走微信云开发（云函数 + 云数据库），好友榜走开放数据域。\n// 榜内只展示真实玩家成绩，没有任何内置假数据。\nconst platform = require(\'./platform.js\');\nconst { CONFIG } = require(\'./data.js\');\n\nconst state = {\n  inited: false,\n  ready: false,\n  reason: \'\',\n  cachedTop: null,\n  cacheAt: 0\n};\n\nfunction init() {\n  if (state.inited) return state;\n  state.inited = true;\n  if (!platform.isWx) {\n    state.reason = \'preview\';\n    return state;\n  }\n  if (!CONFIG.cloudEnv) {\n    state.reason = \'no-env\';\n    return state;\n  }\n  try {\n    if (!wx.cloud) {\n      state.reason = \'no-cloud\';\n      return state;\n    }\n    wx.cloud.init({ env: CONFIG.cloudEnv, traceUser: true });\n    state.ready = true;\n  } catch (e) {\n    state.reason = \'init-error\';\n  }\n  return state;\n}\n\nfunction status() {\n  init();\n  if (state.ready) return { ok: true, mode: \'cloud\' };\n  if (state.reason === \'preview\') return { ok: true, mode: \'demo\' };\n  return { ok: false, mode: \'off\', reason: state.reason };\n}\n\nfunction call(name, data) {\n  return new Promise((resolve, reject) => {\n    wx.cloud.callFunction({\n      name,\n      data,\n      success: (res) => resolve(res.result || {}),\n      fail: (err) => reject(err)\n    });\n  });\n}\n\n// 提交成绩：返回 { ok, best, rank, games }\nfunction submit(payload) {\n  const st = status();\n  if (st.mode === \'demo\') {\n    // 预览环境没有云数据，只回本机最高分，不造假榜单\n    const best = Math.max(state.cachedBest || 0, payload.score);\n    state.cachedBest = best;\n    return Promise.resolve({ ok: true, best, rank: 0, games: 1, demo: true });\n  }\n  if (st.mode !== \'cloud\') {\n    return Promise.resolve({ ok: false, reason: st.reason });\n  }\n  return call(\'submitScore\', {\n    score: payload.score,\n    name: payload.name,\n    gameId: payload.gameId\n  }).then((r) => r).catch((err) => ({ ok: false, reason: \'network\', error: err }));\n}\n\n// 全服前 N\nfunction fetchTop(limit) {\n  const st = status();\n  if (st.mode === \'demo\') {\n    // 没有任何真实数据时返回空榜，由界面显示空状态\n    return Promise.resolve({ ok: true, list: [], demo: true });\n  }\n  if (st.mode !== \'cloud\') {\n    return Promise.resolve({ ok: false, reason: st.reason });\n  }\n  const now = Date.now();\n  if (state.cachedTop && now - state.cacheAt < 15000) {\n    return Promise.resolve({ ok: true, list: state.cachedTop, cached: true });\n  }\n  return call(\'topPlayers\', { limit: limit || 50 })\n    .then((r) => {\n      if (r.ok && Array.isArray(r.list)) {\n        state.cachedTop = r.list;\n        state.cacheAt = now;\n      }\n      return r;\n    })\n    .catch((err) => ({ ok: false, reason: \'network\', error: err }));\n}\n\n// 好友榜：把最高分写进开放数据（关系链 KV），主域只负责画 sharedCanvas\nfunction uploadFriendScore(best) {\n  if (!platform.isWx || typeof wx.setUserCloudStorage !== \'function\') return;\n  try {\n    wx.setUserCloudStorage({\n      KVDataList: [{ key: \'best\', value: String(best || 0) }],\n      fail: () => {}\n    });\n  } catch (e) { /* ignore */ }\n}\n\nlet odc = null;\nlet shared = null;\n\nfunction getOpenData() {\n  if (!platform.isWx) return null;\n  if (odc) return odc;\n  try {\n    odc = wx.getOpenDataContext ? wx.getOpenDataContext() : null;\n    shared = odc ? (odc.canvas || (wx.getSharedCanvas ? wx.getSharedCanvas() : null)) : null;\n  } catch (e) {\n    odc = null;\n  }\n  return odc;\n}\n\nfunction prepareFriendRank(width, height, dpr, scroll) {\n  if (!platform.isWx) return;\n  const ctx = getOpenData();\n  if (!ctx) return;\n  try {\n    ctx.postMessage({ type: \'render\', width, height, dpr: Math.min(dpr || 1, 2) });\n  } catch (e) { /* ignore */ }\n}\n\n// 好友榜行高与可滚动范围（微信端由开放数据域自行管理滚动）\nfunction friendMetrics(height) {\n  return { rowH: Math.min(46, height / 6), maxScroll: 0 };\n}\n\n// 微信端：开始新手势，开放数据域以当前显示位置为基准\nfunction beginFriendsScroll() {\n  if (!platform.isWx) return;\n  const ctx = getOpenData();\n  if (!ctx) return;\n  try { ctx.postMessage({ type: \'scrollStart\' }); } catch (e) { /* ignore */ }\n}\n\n// 微信端：滚动增量交给开放数据域处理，主域不保存绝对位置\nfunction scrollFriends(dy) {\n  if (!platform.isWx) return;\n  const ctx = getOpenData();\n  if (!ctx) return;\n  try { ctx.postMessage({ type: \'scrollBy\', dy }); } catch (e) { /* ignore */ }\n}\n\n// 微信端：松手惯性速度（行/秒）\nfunction flingFriends(vel) {\n  if (!platform.isWx) return;\n  const ctx = getOpenData();\n  if (!ctx) return;\n  try { ctx.postMessage({ type: \'fling\', vel }); } catch (e) { /* ignore */ }\n}\n\nfunction resetFriendsScroll() {\n  if (!platform.isWx) return;\n  const ctx = getOpenData();\n  if (!ctx) return;\n  try { ctx.postMessage({ type: \'scrollReset\' }); } catch (e) { /* ignore */ }\n}\n\nfunction friendCanvas() {\n  return platform.isWx ? shared : null;\n}\n\nmodule.exports = {\n  status,\n  init,\n  submit,\n  fetchTop,\n  uploadFriendScore,\n  prepareFriendRank,\n  friendCanvas,\n  friendMetrics,\n  beginFriendsScroll,\n  scrollFriends,\n  flingFriends,\n  resetFriendsScroll\n};\n',
 "js/app.js": '// 游戏主逻辑：状态机、输入、计分、特效调度。\nconst platform = require(\'./platform.js\');\nconst { Board } = require(\'./board.js\');\nconst { TILES, CONFIG, ACHIEVEMENTS } = require(\'./data.js\');\nconst storage = require(\'./storage.js\');\nconst audio = require(\'./audio.js\');\nconst leaderboard = require(\'./leaderboard.js\');\nconst { Renderer } = require(\'./render.js\');\n\nclass Game {\n  constructor() {\n    this.hit = [];\n    this.waiters = [];\n    this.toasts = [];\n    this.effects = { texts: [], particles: [], shake: 0, shockwaves: [], banners: [] };\n    this.state = \'menu\';\n    this.overlay = null;\n    this.selected = null;\n    this.hintPair = null;\n    this.hintUntil = 0;\n    this.pendingOver = false;\n    this.resultAchievements = [];\n    this.resultRank = 0;\n    this.runUnlocked = [];\n    this.returnToResult = false;\n    this.stats = null;\n    this.board = null;\n    this.rankView = { tab: \'global\', loading: false, error: \'\', list: [], scroll: 0, status: \'off\' };\n    this.run = null;\n    this.L = null;\n    this.touch = null;\n    this.isWx = platform.isWx;\n    this._userBtn = null;\n  }\n\n  // ---------------- 启动 ----------------\n  boot() {\n    const info = platform.getWindowInfo();\n    this.W = info.width;\n    this.H = info.height;\n    this.dpr = info.dpr || 1;\n    this.safeTop = info.safeTop || 0;\n    this.safeBottom = info.safeBottom || 0;\n\n    this.canvas = platform.createCanvas();\n    this.ctx = this.canvas.getContext(\'2d\');\n    platform.resizeCanvas(this.canvas, this.ctx, this.W, this.H, this.dpr);\n\n    this.renderer = new Renderer(this.canvas, this.ctx);\n    this.computeLayout();\n\n    audio.init();\n    platform.preloadRewardedAd(CONFIG.rewardedAdId);\n    this.stats = storage.load();\n    this.board = new Board();\n    leaderboard.init();\n    this.rankView.status = leaderboard.status().mode;\n    this.setupUserInfoButton();\n\n    platform.bindPointer(this.canvas, {\n      start: (p) => this.onStart(p),\n      move: (p) => this.onMove(p),\n      end: (p) => this.onEnd(p),\n      cancel: () => { this.touch = null; }\n    });\n\n    if (platform.isWx && wx.onWindowResize) {\n      wx.onWindowResize((res) => {\n        const w = res.windowWidth || res.size.windowWidth;\n        const h = res.windowHeight || res.size.windowHeight;\n        this.W = w;\n        this.H = h;\n        platform.resizeCanvas(this.canvas, this.ctx, this.W, this.H, this.dpr);\n        this.computeLayout();\n        this.setupUserInfoButton();\n      });\n    }\n\n    // 微信小游戏生命周期：切后台暂停、回前台恢复\n    if (platform.isWx) {\n      if (wx.onHide) wx.onHide(() => {\n        if (this.run && this.run.state === \'playing\') {\n          this.run._pausedAt = Date.now();\n          audio.stopBGM();\n        }\n      });\n      if (wx.onShow) wx.onShow(() => {\n        if (this.run && this.run.state === \'playing\' && this.run._pausedAt) {\n          const dt = Date.now() - this.run._pausedAt;\n          this.run.deadline += dt;  // 后台时间不计入倒计时\n          this.run._pausedAt = null;\n          audio.startBGM();\n        }\n      });\n      // 分享\n      if (wx.showShareMenu) {\n        wx.showShareMenu({ withShareTicket: true, menus: [\'shareAppMessage\', \'shareTimeline\'] });\n      }\n      if (wx.onShareAppMessage) {\n        wx.onShareAppMessage(() => ({\n          title: \'中华美食消消乐 · 一起来消除美味！\',\n          imageUrl: \'\',  // TODO: 替换为分享封面图 URL\n          query: \'\'\n        }));\n      }\n    }\n\n    this.last = 0;\n    this.loop = this.loop.bind(this);\n    platform.raf(this.loop);\n  }\n\n  computeLayout() {\n    const W = this.W;\n    const H = this.H;\n    const u = Math.max(0.85, Math.min(1.28, W / 375));\n    this.u = u;\n    const pad = 14 * u;\n    const brandY = this.safeTop + 8 * u;\n    const brandH = 28 * u;\n    const scoreY = brandY + brandH + 5 * u;\n    const scoreH = 54 * u;\n    const barY = scoreY + scoreH + 2 * u;\n    const barH = 7 * u;\n    const heatY = barY + barH + 10 * u;\n    const heatH = 36 * u;\n    const boardTopMin = heatY + heatH + 11 * u;\n    const itemsH = 60 * u;\n    const legendH = 54 * u;\n\n    let boardSize = Math.min(W - 24 * u, H - this.safeBottom - boardTopMin - itemsH - 34 * u);\n    boardSize = Math.max(200 * u, boardSize);\n\n    // 底部：道具按钮 + 彩头说明（屏幕够高才显示）\n    const snugY = boardTopMin + boardSize + 12 * u;\n    const legendY = H - this.safeBottom - 14 * u - legendH;\n    const legendItemsY = legendY - 12 * u - itemsH;\n    const showLegend = legendItemsY >= snugY + 10 * u;\n    const itemsY = showLegend ? legendItemsY : snugY;\n    const extra = Math.max(0, itemsY - snugY);\n    const boardTop = boardTopMin + extra * 0.5;\n\n    const boardX = (W - boardSize) / 2;\n    const inner = 11 * u;\n    const cell = (boardSize - inner * 2) / 8;\n    this.showLegend = showLegend;\n    this.L = {\n      pad, brandY, brandH, scoreY, scoreH, barY, barH, heatY, heatH,\n      boardTop, boardSize, boardX, inner, cell, itemsY, itemsH,\n      legendY, legendH\n    };\n    this.L.bx = boardX + inner;\n    this.L.by = boardTop + inner;\n  }\n\n  // ---------------- 微信昵称 ----------------\n  displayName() {\n    if (this.stats && this.stats.wxName) return this.stats.wxName;\n    if (this.isWx) return \'点击登录\';\n    return this.stats ? this.stats.name : \'\';\n  }\n\n  nameChipWidth() {\n    const u = this.u;\n    this.ctx.font = \'bold \' + (12 * u) + \'px sans-serif\';\n    return Math.min(this.ctx.measureText(this.displayName()).width + 36 * u, this.W * 0.42);\n  }\n\n  // 在左上角昵称位置覆盖一个透明的「微信用户信息按钮」，点击授权后取昵称\n  setupUserInfoButton() {\n    if (!this.isWx || !this.L) return;\n    if (this._userBtn) {\n      try { this._userBtn.destroy(); } catch (e) { /* ignore */ }\n      this._userBtn = null;\n    }\n    this._userBtn = platform.createUserInfoButton({\n      x: this.L.pad,\n      y: this.L.brandY,\n      w: this.nameChipWidth(),\n      h: this.L.brandH\n    }, (info) => this.onWxUserInfo(info));\n    if (this._userBtn) {\n      if (this.state === \'menu\' && !this.overlay) this._userBtn.show();\n      else this._userBtn.hide();\n    }\n  }\n\n  onWxUserInfo(info) {\n    if (this.state === \'playing\' || this.state === \'busy\') return;\n    if (!info || !info.nickName) {\n      this.toast(\'未获取到微信昵称\');\n      return;\n    }\n    this.stats.wxName = String(info.nickName);\n    storage.save(this.stats);\n    // 昵称宽度变化，稍后重建覆盖按钮（避免在自身回调里销毁）\n    setTimeout(() => this.setupUserInfoButton(), 60);\n    this.toast(\'已显示微信昵称\');\n  }\n\n  // ---------------- 主循环 ----------------\n  loop(ts) {\n    const now = typeof ts === \'number\' ? ts : Date.now();\n    let dt = this.last ? now - this.last : 16;\n    this.last = now;\n    if (dt > 60) dt = 60;\n    if (dt < 0) dt = 0;\n    this.update(dt);\n    this.hit = [];\n    this.renderer.render(this);\n    platform.raf(this.loop);\n  }\n\n  // 排行榜惯性滚动与边界回弹\n  updateScroll(dt) {\n    if (this.overlay !== \'rank\') return;\n    if (this.rankView.tab !== \'global\') return;\n    const v = this.rankView;\n    const max = v.maxScroll || 0;\n    if (!v.scrollVel && v.scroll >= 0 && v.scroll <= max) return;\n    const sec = Math.min(0.05, dt / 1000);\n\n    if (v.scrollVel) {\n      v.scroll += v.scrollVel * sec;\n      v.scrollVel *= Math.pow(0.02, sec); // 指数衰减，约 1 秒内停下\n      if (Math.abs(v.scrollVel) < 0.4) v.scrollVel = 0;\n    }\n    if (v.scroll < 0) {\n      v.scroll += (0 - v.scroll) * Math.min(1, sec * 14);\n      if (v.scroll > -0.004) { v.scroll = 0; v.scrollVel = 0; }\n    } else if (v.scroll > max) {\n      v.scroll += (max - v.scroll) * Math.min(1, sec * 14);\n      if (v.scroll < max + 0.004) { v.scroll = max; v.scrollVel = 0; }\n    }\n  }\n\n  update(dt) {\n    this.tickWaiters(dt);\n    this.updateTiles(dt);\n    this.updateEffects(dt);\n    this.updateToasts(dt);\n    this.updateScroll(dt);\n\n    if (this.hintPair && Date.now() > this.hintUntil) this.hintPair = null;\n\n    if (this.overlay || this.state === \'menu\' || this.state === \'over\') return;\n    if (this.state !== \'playing\' && this.state !== \'busy\') return;\n    if (!this.run) return;\n\n    // 倒计时：基于绝对时间戳，切到后台也继续走\n    if (this.state === \'playing\' && this.run.heat > 0) {\n      // 锅气窗口：冻结倒计时\n      this.run.heatTimer -= dt / 1000;\n      if (this.run.heatTimer <= 0) {\n        this.run.heat = 0;\n        this.run.heatTimer = 0;\n        this.run.deadline = Date.now() + this.run.time * 1000; // 重新锚定\n      }\n    } else {\n      this.run.time = (this.run.deadline - Date.now()) / 1000;\n    }\n    if (this.run.time <= 0) {\n      this.run.time = 0;\n      if (this.state === \'playing\') {\n        this.endGame();\n      } else {\n        this.pendingOver = true;\n      }\n      return;\n    }\n  }\n\n  tickWaiters(dt) {\n    if (!this.waiters.length) return;\n    const due = [];\n    for (let i = this.waiters.length - 1; i >= 0; i--) {\n      const w = this.waiters[i];\n      w.t -= dt;\n      if (w.t <= 0) {\n        this.waiters.splice(i, 1);\n        due.push(w.res);\n      }\n    }\n    due.forEach((res) => res());\n  }\n\n  wait(ms) {\n    return new Promise((res) => this.waiters.push({ t: ms, res }));\n  }\n\n  updateTiles(dt) {\n    if (!this.board) return;\n    // 时间归一化，保证不同帧率下手感一致\n    const k = Math.min(1, (dt / 16.67) * 0.42);\n    const frame = dt / 16.67;\n    this.board.each((tile) => {\n      if (tile.clearing) {\n        const kk = Math.min(1, k * 2.4);\n        tile.scale += (0 - tile.scale) * kk;\n        tile.alpha = Math.max(0, tile.scale);\n      } else {\n        const oldPx = tile.px;\n        const oldPy = tile.py;\n        // 更快的插值，让滑动更干脆\n        tile.px += (tile.col - tile.px) * k;\n        tile.py += (tile.row - tile.py) * k;\n\n        // 计算速度（格/帧），用于挤压拉伸\n        const vx = (tile.px - oldPx) * frame;\n        const vy = (tile.py - oldPy) * frame;\n        const speed = Math.sqrt(vx * vx + vy * vy);\n        const moving = speed > 0.004;\n\n        if (moving) {\n          // 运动方向拉伸：沿运动方向拉长，垂直方向压扁\n          const stretch = 1 + Math.min(0.18, speed * 1.6);\n          const squash = 1 / stretch;\n          if (Math.abs(vx) >= Math.abs(vy)) {\n            tile.scaleX = stretch;\n            tile.scaleY = squash;\n          } else {\n            tile.scaleX = squash;\n            tile.scaleY = stretch;\n          }\n          tile._arrived = false;\n        } else if (!tile._arrived) {\n          // 刚到达：轻微弹出回弹\n          tile.scaleX = 1.12;\n          tile.scaleY = 0.88;\n          tile._arrived = true;\n          tile._popT = 0;\n        }\n\n        // 回弹动画\n        if (tile._arrived) {\n          tile._popT = (tile._popT || 0) + dt;\n          const pt = Math.min(1, tile._popT / 220);\n          // easeOutBack 风格回弹\n          const ease = pt < 1 ? 1 + 2.7 * Math.pow(pt - 1, 3) + 1.7 * Math.pow(pt - 1, 2) : 1;\n          const t = Math.max(0, Math.min(1, ease));\n          tile.scaleX += (1 - tile.scaleX) * (0.2 + t * 0.8);\n          tile.scaleY += (1 - tile.scaleY) * (0.2 + t * 0.8);\n        }\n\n        tile.scale += (1 - tile.scale) * Math.min(1, k * 1.5);\n        if (Math.abs(tile.col - tile.px) < 0.008) tile.px = tile.col;\n        if (Math.abs(tile.row - tile.py) < 0.008) tile.py = tile.row;\n      }\n    });\n  }\n\n  updateEffects(dt) {\n    const e = this.effects;\n    const f = dt / 16.67;\n    for (let i = e.particles.length - 1; i >= 0; i--) {\n      const p = e.particles[i];\n      p.x += p.vx * f;\n      p.y += p.vy * f;\n      p.vy += 0.12 * f;\n      p.vx *= 0.98;\n      p.life -= dt;\n      if (p.life <= 0) e.particles.splice(i, 1);\n    }\n    for (let i = e.texts.length - 1; i >= 0; i--) {\n      const t = e.texts[i];\n      t.y -= 0.55 * f * (t.size / 16);\n      t.life -= dt;\n      if (t.life <= 0) e.texts.splice(i, 1);\n    }\n    for (let i = e.shockwaves.length - 1; i >= 0; i--) {\n      const s = e.shockwaves[i];\n      s.life -= dt;\n      s.r = s.r0 + (1 - s.life / s.max) * s.spread;\n      if (s.life <= 0) e.shockwaves.splice(i, 1);\n    }\n    for (let i = e.banners.length - 1; i >= 0; i--) {\n      const b = e.banners[i];\n      b.life -= dt;\n      if (b.life <= 0) e.banners.splice(i, 1);\n    }\n    if (e.shake > 0) e.shake = Math.max(0, e.shake - dt * 0.035);\n  }\n\n  updateToasts(dt) {\n    for (let i = this.toasts.length - 1; i >= 0; i--) {\n      this.toasts[i].life -= dt;\n      if (this.toasts[i].life <= 0) this.toasts.splice(i, 1);\n    }\n  }\n\n  // ---------------- 输入 ----------------\n  hitTest(p) {\n    for (let i = this.hit.length - 1; i >= 0; i--) {\n      const h = this.hit[i];\n      if (p.x >= h.x && p.x <= h.x + h.w && p.y >= h.y && p.y <= h.y + h.h) return h.id;\n    }\n    return null;\n  }\n\n  cellAt(p) {\n    const L = this.L;\n    if (!L) return null;\n    const c = Math.floor((p.x - L.bx) / L.cell);\n    const r = Math.floor((p.y - L.by) / L.cell);\n    if (r < 0 || c < 0 || r >= this.board.size || c >= this.board.size) return null;\n    return { r, c };\n  }\n\n  onStart(p) {\n    // 首次触摸时解锁音频（浏览器需要用户手势，Safari 尤其严格）\n    audio.unlock();\n    const id = this.hitTest(p);\n    this.touch = { x: p.x, y: p.y, hitId: id, cell: null, swapped: false };\n    if (id) return;\n    // 排行榜列表支持上下拖动滚动\n    if (this.overlay === \'rank\') {\n      if (this.rankView.tab === \'friend\') {\n        leaderboard.beginFriendsScroll();\n      }\n      this.touch.scroll = {\n        y: p.y,\n        base: this.rankView.scroll || 0,\n        active: false,\n        lastY: p.y,\n        lastT: Date.now(),\n        vel: 0\n      };\n      return;\n    }\n    if (!this.overlay && this.state === \'playing\') {\n      const cell = this.cellAt(p);\n      if (cell) this.touch.cell = cell;\n    }\n  }\n\n  onMove(p) {\n    const t = this.touch;\n    if (!t) return;\n    if (t.scroll) {\n      const sd = t.scroll;\n      const dy = sd.y - p.y;\n      if (Math.abs(dy) > 6) sd.active = true;\n      if (!sd.active) return;\n      const now = Date.now();\n      const dt = Math.max(1, now - sd.lastT);\n      const delta = sd.lastY - p.y;\n      const rowH = this.rankView.rowH || 46;\n      // 平滑速度采样（行/秒），用于松手后的惯性滑动\n      sd.vel = sd.vel * 0.7 + (delta / rowH) / (dt / 1000) * 0.3;\n      sd.lastY = p.y;\n      sd.lastT = now;\n\n      if (this.rankView.tab === \'global\') {\n        const max = this.rankView.maxScroll || 0;\n        let next = sd.base + dy / rowH;\n        // 越界时阻尼拉伸，松手回弹\n        if (next < 0) next *= 0.35;\n        else if (next > max) next = max + (next - max) * 0.35;\n        this.rankView.scroll = next;\n      } else {\n        // 好友榜由开放数据域自己维护滚动位置，这里只转发增量\n        leaderboard.scrollFriends(delta);\n      }\n      return;\n    }\n    if (!t.cell || t.swapped || this.state !== \'playing\') return;\n    const dx = p.x - t.x;\n    const dy = p.y - t.y;\n    const need = this.L.cell * 0.36;\n    if (Math.abs(dx) < need && Math.abs(dy) < need) return;\n    const horizontal = Math.abs(dx) > Math.abs(dy);\n    const nr = t.cell.r + (horizontal ? 0 : (dy > 0 ? 1 : -1));\n    const nc = t.cell.c + (horizontal ? (dx > 0 ? 1 : -1) : 0);\n    const a = this.board.at(t.cell.r, t.cell.c);\n    const b = this.board.at(nr, nc);\n    t.swapped = true;\n    if (a && b) {\n      this.hintPair = null;\n      this.selected = null;\n      this.trySwap(a, b);\n    }\n  }\n\n  onEnd(p) {\n    const t = this.touch;\n    this.touch = null;\n    if (!t) return;\n\n    if (t.scroll) {\n      // 松手：全局榜做惯性衰减 + 边界回弹；好友榜把速度甩给开放数据域\n      if (t.scroll.active) {\n        if (this.rankView.tab === \'global\') {\n          this.rankView.scrollVel = Math.max(-60, Math.min(60, t.scroll.vel));\n        } else {\n          leaderboard.flingFriends(t.scroll.vel);\n        }\n        return;\n      }\n    }\n\n    if (t.hitId) {\n      const now = p ? this.hitTest(p) : t.hitId;\n      if (now === t.hitId) this.onAction(t.hitId);\n      return;\n    }\n    if (this.overlay === \'result\') {\n      this.closeResult();\n      return;\n    }\n    if (!t.cell || t.swapped || this.state !== \'playing\') return;\n\n    const tile = this.board.at(t.cell.r, t.cell.c);\n    if (!tile) return;\n    if (this.selected && this.selected !== tile && this.board.isAdjacent(this.selected, tile)) {\n      const a = this.board.at(this.selected.row, this.selected.col);\n      this.selected = null;\n      this.hintPair = null;\n      if (a) this.trySwap(a, tile);\n    } else if (this.selected === tile) {\n      this.selected = null;\n    } else {\n      this.selected = tile;\n      audio.SFX.tap();\n    }\n  }\n\n  onAction(id) {\n    switch (id) {\n      case \'start\':\n      case \'again\':\n        this.startGame();\n        break;\n      case \'rank\':\n      case \'resultRank\':\n        this.openRank(id === \'resultRank\');\n        break;\n      case \'achv\':\n        this.openAchievements();\n        break;\n      case \'hint\':\n        this.useHint();\n        break;\n      case \'shuffle\':\n        this.useShuffle();\n        break;\n      case \'ad_confirm\':\n        this.watchAd();\n        break;\n      case \'close\':\n        this.closeOverlay();\n        break;\n      case \'refresh\':\n        this.loadTop(true);\n        break;\n      case \'tab_global\':\n        this.rankView.tab = \'global\';\n        this.rankView.scroll = 0;\n        this.rankView.scrollVel = 0;\n        this.loadTop();\n        break;\n      case \'tab_friend\':\n        this.rankView.tab = \'friend\';\n        this.rankView.scroll = 0;\n        this.rankView.scrollVel = 0;\n        leaderboard.resetFriendsScroll();\n        break;\n      case \'name\':\n        this.editName();\n        break;\n      default:\n        if (id && id.indexOf(\'achv_detail_\') === 0) {\n          this.showAchievementDetail(id.slice(\'achv_detail_\'.length));\n        }\n        break;\n    }\n  }\n\n  // 成就详情弹窗：显示成就名称、条件、是否已获得\n  showAchievementDetail(achId) {\n    const def = ACHIEVEMENTS.find((a) => a.id === achId);\n    if (!def) return;\n    const unlocked = (this.stats.unlocked || []).indexOf(achId) >= 0;\n    this.achvDetail = def;\n    this.toast((unlocked ? \'🏅 \' : \'🔒 \') + def.name + \'：\' + def.desc);\n  }\n\n  // ---------------- 局内 ----------------\n  startGame() {\n    this.overlay = null;\n    this.selected = null;\n    this.hintPair = null;\n    this.pendingOver = false;\n    this.resultAchievements = [];\n    this.resultRank = 0;\n    this.runUnlocked = [];\n    this.effects = { texts: [], particles: [], shake: 0, shockwaves: [], banners: [] };\n    this.toasts = [];\n\n    const prevBest = this.stats.best;\n    this.board = new Board();\n    const luckyTypes = this.board.pickLuckyTypes(CONFIG.luckyPerRun);\n    this.board.luckyTypes = luckyTypes;\n    this.board.luckyChance = 0.24;\n    this.board.markLucky(luckyTypes, 0.24);\n\n    this.run = {\n      score: 0,\n      moves: CONFIG.maxMoves,\n      time: CONFIG.roundSeconds,\n      roundSeconds: CONFIG.roundSeconds,\n      deadline: Date.now() + CONFIG.roundSeconds * 1000,\n      heat: 0,\n      heatTimer: 0,\n      heatPeak: 0,\n      comboMax: 0,\n      clearMax: 0,\n      luckyHits: 0,\n      luckyBest: 0,\n      typesCleared: new Set(),\n      hints: CONFIG.hintLimit,\n      shuffles: CONFIG.shuffleLimit,\n      nextBonus: CONFIG.timeBonusStep,\n      prevBest,\n      luckyTypes,\n      startTs: Date.now(),\n      gameId: String(this.stats.games + 1) + \'_\' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6)\n    };\n    this.state = \'playing\';\n    if (this._userBtn) this._userBtn.hide();\n    audio.SFX.start();\n    audio.startBGM();\n  }\n\n  async trySwap(a, b) {\n    if (this.state !== \'playing\' || this.overlay || !this.run) return;\n    if (this.run.moves <= 0) return;\n    this.state = \'busy\';\n    this.hintPair = null;\n    this.selected = null;\n\n    this.board.swapTiles(a, b);\n    audio.SFX.swap();\n    await this.wait(150);\n\n    if (!this.board.findMatches().size) {\n      this.board.swapTiles(a, b);\n      audio.SFX.bad();\n      this.effects.shake = 3;\n      await this.wait(150);\n      this.state = \'playing\';\n      return;\n    }\n\n    // 有效交换 → 消耗一步\n    this.run.moves = Math.max(0, this.run.moves - 1);\n\n    // 有效交换 → 锅气 +1，重置 5 秒窗口\n    this.run.heat = Math.min(CONFIG.heatMax, this.run.heat + 1);\n    this.run.heatTimer = CONFIG.heatWindow;\n    this.run.heatPeak = Math.max(this.run.heatPeak, this.run.heat);\n    if (this.run.heat >= CONFIG.heatMax) this.unlock(\'heat_max\');\n    if (this.run.heat >= 3) this.unlock(\'heat_3\');\n    audio.SFX.heat();\n\n    await this.resolve();\n\n    this.state = \'playing\';\n    if (this.run.moves <= 0) this.pendingOver = true;\n    if (this.pendingOver) {\n      this.pendingOver = false;\n      this.endGame();\n    }\n  }\n\n  // 分析匹配集合，找出 4 连及以上，把中间棋子变成特效棋子（保留不消除）\n  // 返回需要保留的特效棋子集合\n  markSpecials(hit) {\n    const kept = new Set();\n    const n = this.board.size;\n    // 横向 4 连\n    for (let r = 0; r < n; r++) {\n      let run = 1;\n      for (let c = 1; c <= n; c++) {\n        const prev = this.board.at(r, c - 1);\n        const cur = c < n ? this.board.at(r, c) : null;\n        if (cur && prev && cur.type === prev.type && hit.has(cur) && hit.has(prev)) {\n          run++;\n        } else {\n          if (run >= 4) {\n            const mid = c - run + Math.floor(run / 2);\n            const t = this.board.at(r, mid);\n            if (t) { t.special = \'row\'; kept.add(t); }\n          }\n          run = 1;\n        }\n      }\n    }\n    // 纵向 4 连\n    for (let c = 0; c < n; c++) {\n      let run = 1;\n      for (let r = 1; r <= n; r++) {\n        const prev = this.board.at(r - 1, c);\n        const cur = r < n ? this.board.at(r, c) : null;\n        if (cur && prev && cur.type === prev.type && hit.has(cur) && hit.has(prev)) {\n          run++;\n        } else {\n          if (run >= 4) {\n            const mid = r - run + Math.floor(run / 2);\n            const t = this.board.at(mid, c);\n            if (t && !t.special) { t.special = \'col\'; kept.add(t); }\n          }\n          run = 1;\n        }\n      }\n    }\n    return kept;\n  }\n\n  // 特效棋子触发：把消行/消列的棋子加入消除集合\n  expandSpecials(hit) {\n    const queue = Array.from(hit).filter((t) => t.special);\n    const seen = new Set(queue.map((t) => t.id));\n    while (queue.length) {\n      const t = queue.shift();\n      const n = this.board.size;\n      if (t.special === \'row\') {\n        for (let c = 0; c < n; c++) {\n          const o = this.board.at(t.row, c);\n          if (o && !seen.has(o.id)) { seen.add(o.id); hit.add(o); if (o.special) queue.push(o); }\n        }\n      } else if (t.special === \'col\') {\n        for (let r = 0; r < n; r++) {\n          const o = this.board.at(r, t.col);\n          if (o && !seen.has(o.id)) { seen.add(o.id); hit.add(o); if (o.special) queue.push(o); }\n        }\n      }\n    }\n  }\n\n  async resolve() {\n    if (!this.run) return;\n    let cascade = 1;\n    while (cascade <= 30) {\n      const hit = this.board.findMatches();\n      if (!hit.size) break;\n\n      // 4 连生成特效棋子（保留不消除）\n      const kept = this.markSpecials(hit);\n      kept.forEach((t) => hit.delete(t));\n\n      // 特效棋子触发消行/消列\n      this.expandSpecials(hit);\n\n      const tiles = Array.from(hit);\n      const n = tiles.length;\n\n      this.run.comboMax = Math.max(this.run.comboMax, cascade);\n      this.run.clearMax = Math.max(this.run.clearMax, n);\n      tiles.forEach((t) => this.run.typesCleared.add(t.type));\n\n      const mult = 1 + this.run.heat * 0.1;\n      const base = n * 20 * cascade + Math.max(0, n - 3) * 30;\n      let gain = Math.round(base * mult);\n\n      let luckyCount = 0;\n      tiles.forEach((t) => { if (t.lucky) luckyCount++; });\n      if (luckyCount > 0) {\n        const luckyBonus = luckyCount * 50 * (luckyCount >= 4 ? 2 : 1);\n        gain += luckyBonus;\n        this.run.luckyHits += luckyCount;\n        this.run.luckyBest = Math.max(this.run.luckyBest, luckyCount);\n        audio.SFX.lucky();\n        if (luckyCount >= 4) this.floatText(tiles, \'彩头 ×2!\', \'#e08a1f\', 20);\n      }\n      if (this.run.luckyHits >= 8) this.unlock(\'lucky_12\');\n      if (this.run.luckyHits >= 5) this.unlock(\'lucky_5\');\n\n      this.run.score += gain;\n\n      if (cascade >= 2) this.unlock(\'combo_2\');\n      if (cascade >= 3) this.unlock(\'combo_3\');\n      if (cascade >= 5) this.unlock(\'combo_5\');\n      if (cascade >= 7) this.unlock(\'combo_7\');\n      if (n >= 5) this.unlock(\'clear_5\');\n      if (n >= 10) this.unlock(\'clear_10\');\n      if (n >= 15) this.unlock(\'clear_15\');\n      if (this.run.typesCleared.size >= 7) this.unlock(\'all_types\');\n      if (Date.now() - this.run.startTs <= 30000 && this.run.score >= 1500) this.unlock(\'speed_1500\');\n\n      const hasSpecial = tiles.some((t) => t.special);\n      audio.SFX.match(cascade);\n      if (hasSpecial) audio.SFX.special();\n      if (cascade > 1) {\n        audio.SFX.combo(cascade);\n        const words = [\'GOOD!\', \'NICE!\', \'GREAT!\', \'EXCELLENT!\', \'AMAZING!\', \'UNBELIEVABLE!\'];\n        const word = words[Math.min(cascade - 2, words.length - 1)];\n        this.floatText(tiles, word, \'#ff5c1a\', 27 * Math.min(1, 8.5 / word.length), -1.05);\n        this.shockwave(tiles, cascade);\n      }\n      platform.vibrate(cascade >= 3 || hasSpecial);\n\n      if (cascade > 1) {\n        this.floatText(tiles, cascade + \' 连击\', \'#d95a2a\', 15, -0.55);\n      }\n      if (hasSpecial) {\n        // 大范围消除的庆祝文案（不再出现“特效”字样）\n        const cheer = n >= 15 ? \'满堂彩!\' : (n >= 10 ? \'香飘十里!\' : \'爆香!\');\n        this.floatText(tiles, cheer, \'#a855f7\', 22, -1.6);\n        this.effects.shake = Math.max(this.effects.shake, 7);\n      }\n      this.burst(tiles, cascade);\n      this.effects.shake = Math.min(9, Math.max(this.effects.shake, 2 + n * 0.35 + cascade));\n\n      // 每满 1000 分加时\n      while (this.run.score >= this.run.nextBonus) {\n        this.run.time += CONFIG.timeBonusSeconds;\n        this.run.deadline += CONFIG.timeBonusSeconds * 1000;\n        this.run.nextBonus += CONFIG.timeBonusStep;\n        this.toast(\'+\' + CONFIG.timeBonusSeconds + \' 秒\');\n        audio.SFX.bonus();\n        this.effects.shake = Math.max(this.effects.shake, 3);\n      }\n\n      tiles.forEach((t) => { t.clearing = true; });\n      await this.wait(190);\n\n      this.board.removeCleared();\n      this.board.applyGravity();\n      await this.wait(210);\n      cascade++;\n    }\n\n    // 无解自动重排（此时倒计时暂停）\n    if (!this.board.hasMove()) {\n      this.toast(\'无路可走，自动重排\');\n      await this.wait(120);\n      this.board.shuffle();\n      await this.wait(260);\n    }\n  }\n\n  tileCenter(tile) {\n    const L = this.L;\n    return {\n      x: L.bx + (tile.px + 0.5) * L.cell,\n      y: L.by + (tile.py + 0.5) * L.cell\n    };\n  }\n\n  floatText(tiles, text, color, size, extraDy) {\n    let sx = 0;\n    let sy = 0;\n    tiles.forEach((t) => {\n      const p = this.tileCenter(t);\n      sx += p.x;\n      sy += p.y;\n    });\n    const cx = sx / tiles.length;\n    const cy = sy / tiles.length;\n    this.effects.texts.push({\n      text,\n      x: cx,\n      y: cy + (extraDy || 0) * this.L.cell,\n      size: size * this.u,\n      color,\n      life: 780,\n      max: 780\n    });\n  }\n\n  burst(tiles, cascade) {\n    const count = Math.min(3 + cascade, 12);\n    tiles.forEach((t) => {\n      const p = this.tileCenter(t);\n      for (let i = 0; i < count; i++) {\n        const ang = Math.random() * Math.PI * 2;\n        const sp = 1 + Math.random() * 2.2 + cascade * 0.25;\n        this.effects.particles.push({\n          x: p.x,\n          y: p.y,\n          vx: Math.cos(ang) * sp,\n          vy: Math.sin(ang) * sp - 1.2,\n          r: (1.6 + Math.random() * 2.6) * this.u,\n          life: 420 + Math.random() * 260,\n          max: 680,\n          color: TILES[t.type].color\n        });\n      }\n    });\n    // 高连击额外金色粒子\n    if (cascade >= 3) {\n      const cx = tiles.reduce((s, t) => s + this.tileCenter(t).x, 0) / tiles.length;\n      const cy = tiles.reduce((s, t) => s + this.tileCenter(t).y, 0) / tiles.length;\n      const goldCount = cascade * 4;\n      for (let i = 0; i < goldCount; i++) {\n        const ang = Math.random() * Math.PI * 2;\n        const sp = 2 + Math.random() * 4 + cascade * 0.3;\n        this.effects.particles.push({\n          x: cx, y: cy,\n          vx: Math.cos(ang) * sp,\n          vy: Math.sin(ang) * sp - 2,\n          r: (2 + Math.random() * 3) * this.u,\n          life: 500 + Math.random() * 300,\n          max: 800,\n          color: Math.random() > 0.5 ? \'#ffd34d\' : \'#ffb300\'\n        });\n      }\n    }\n    if (this.effects.particles.length > 600) {\n      this.effects.particles.splice(0, this.effects.particles.length - 600);\n    }\n  }\n\n  // 连击冲击波：从消除中心扩散的圆环\n  shockwave(tiles, cascade) {\n    const cx = tiles.reduce((s, t) => s + this.tileCenter(t).x, 0) / tiles.length;\n    const cy = tiles.reduce((s, t) => s + this.tileCenter(t).y, 0) / tiles.length;\n    const colors = [\'#ff5c1a\', \'#ffb300\', \'#ff3d7f\', \'#a855f7\', \'#22d3ee\'];\n    this.effects.shockwaves.push({\n      x: cx, y: cy,\n      r0: this.L.cell * 0.3,\n      r: this.L.cell * 0.3,\n      spread: this.L.cell * (1.2 + cascade * 0.4),\n      life: 450,\n      max: 450,\n      color: colors[Math.min(cascade - 2, colors.length - 1)] || \'#ff5c1a\',\n      width: (2 + cascade * 0.6) * this.u\n    });\n  }\n\n  // 成就解锁横幅\n  achievementBanner(name, desc) {\n    this.effects.banners.push({\n      name: name || \'成就解锁\',\n      desc: desc || \'\',\n      life: 2200,\n      max: 2200\n    });\n    // 成就解锁时的金色粒子爆发\n    const cx = this.W / 2;\n    const cy = this.H * 0.32;\n    for (let i = 0; i < 40; i++) {\n      const ang = Math.random() * Math.PI * 2;\n      const sp = 2 + Math.random() * 5;\n      this.effects.particles.push({\n        x: cx, y: cy,\n        vx: Math.cos(ang) * sp,\n        vy: Math.sin(ang) * sp - 1,\n        r: (2 + Math.random() * 3) * this.u,\n        life: 600 + Math.random() * 400,\n        max: 1000,\n        color: Math.random() > 0.5 ? \'#ffd34d\' : \'#ffb300\'\n      });\n    }\n    this.effects.shake = Math.max(this.effects.shake, 4);\n  }\n\n  useHint() {\n    if (this.state !== \'playing\' || this.overlay) return;\n    if (this.run.hints <= 0) {\n      this.openAdDialog(\'hint\');\n      return;\n    }\n    const pair = this.board.findHint();\n    if (!pair) {\n      this.toast(\'没有可消除的组合，试试重排\');\n      return;\n    }\n    this.run.hints--;\n    this.hintPair = pair;\n    this.hintUntil = Date.now() + 2600;\n    audio.SFX.tap();\n  }\n\n  useShuffle() {\n    if (this.state === \'busy\' || this.overlay || this.state !== \'playing\') return;\n    if (this.run.shuffles <= 0) {\n      this.openAdDialog(\'shuffle\');\n      return;\n    }\n    this.run.shuffles--;\n    this.selected = null;\n    this.hintPair = null;\n    this.board.shuffle();\n    this.toast(\'棋子已重排\');\n    audio.SFX.swap();\n    platform.vibrate(false);\n  }\n\n  // 道具次数用完：弹出看广告获得次数的对话框\n  openAdDialog(item) {\n    this.adItem = item;\n    this.overlay = \'ad\';\n  }\n\n  async watchAd() {\n    const item = this.adItem;\n    if (!item) return;\n    try {\n      await platform.showRewardedAd(CONFIG.rewardedAdId);\n      if (item === \'hint\') this.run.hints++;\n      else this.run.shuffles++;\n      this.toast(\'获得 1 次\' + (item === \'hint\' ? \'提示\' : \'重排\'));\n      audio.SFX.bonus();\n    } catch (e) {\n      const msg = (e && e.message) || \'\';\n      if (msg === \'ad_loading\') this.toast(\'广告加载中，请稍候\');\n      else if (msg === \'ad_not_finished\') this.toast(\'需看完广告才能获得奖励\');\n      else this.toast(\'广告加载失败，请稍后再试\');\n    }\n    this.overlay = null;\n    this.adItem = null;\n  }\n\n  // ---------------- 结算 ----------------\n  endGame() {\n    if (this.state === \'over\' || !this.run) return;\n    // 弹层未关时先挂起，等玩家关掉再结算\n    if (this.overlay && this.overlay !== \'result\') {\n      this.pendingOver = true;\n      return;\n    }\n    this.state = \'over\';\n    this.selected = null;\n    this.hintPair = null;\n    audio.SFX.over();\n    audio.stopBGM();\n\n    const r = this.run;\n    this.stats.games += 1;\n    this.stats.total += r.score;\n    if (r.score > this.stats.best) this.stats.best = r.score;\n    storage.save(this.stats);\n\n    this.unlock(\'first\');\n    if (r.score >= 500) this.unlock(\'score_500\');\n    if (r.score >= 1500) this.unlock(\'score_1500\');\n    if (r.score >= 2500) this.unlock(\'score_3000\');\n    if (r.score >= 4000) this.unlock(\'score_6000\');\n    if (r.score >= 6000) this.unlock(\'score_10000\');\n    if (r.score >= 8000) this.unlock(\'score_15000\');\n    if (r.score >= 2000 && r.shuffles === CONFIG.shuffleLimit) this.unlock(\'no_shuffle_3000\');\n    if (this.stats.games >= 5) this.unlock(\'games_5\');\n    if (this.stats.games >= 10) this.unlock(\'games_10\');\n\n    this.resultAchievements = this.runUnlocked.slice();\n    this.overlay = \'result\';\n    this.returnToResult = false;\n\n    leaderboard.uploadFriendScore(this.stats.best);\n    leaderboard.submit({\n      score: r.score,\n      name: this.stats.wxName || this.stats.name,\n      gameId: r.gameId\n    }).then((res) => {\n      if (res && res.ok) {\n        if (res.rank) this.resultRank = res.rank;\n        if (res.best && res.best > this.stats.best) {\n          this.stats.best = res.best;\n          storage.save(this.stats);\n        }\n        if (res.rank === 1) this.unlock(\'rank_1\');\n        if (this.overlay === \'result\') this.resultAchievements = this.runUnlocked.slice();\n      }\n    }).catch(() => {});\n  }\n\n  closeResult() {\n    this.overlay = null;\n    this.state = \'menu\';\n    this.board = new Board();\n    this.run = null;\n    audio.stopBGM();\n    if (this._userBtn) this._userBtn.show();\n  }\n\n  // ---------------- 弹层 ----------------\n  openRank(fromResult) {\n    this.returnToResult = !!fromResult;\n    this.overlay = \'rank\';\n    if (this._userBtn) this._userBtn.hide();\n    this.rankView.tab = this.rankView.tab || \'global\';\n    this.rankView.scroll = 0;\n    this.rankView.scrollVel = 0;\n    if (this.rankView.tab === \'global\') this.loadTop();\n    else leaderboard.resetFriendsScroll();\n  }\n\n  closeOverlay() {\n    if (this.returnToResult) {\n      this.overlay = \'result\';\n      this.returnToResult = false;\n    } else {\n      this.overlay = null;\n    }\n    if (this.pendingOver && this.run && (this.run.time <= 0 || this.run.moves <= 0) && this.state !== \'over\') {\n      this.pendingOver = false;\n      this.endGame();\n    }\n    if (this._userBtn) {\n      if (this.state === \'menu\' && !this.overlay) this._userBtn.show();\n      else this._userBtn.hide();\n    }\n  }\n\n  loadTop(force) {\n    if (this.rankView.loading) return;\n    if (!force && this.rankView.list.length) return;\n    this.rankView.loading = true;\n    this.rankView.error = \'\';\n    leaderboard.fetchTop(50).then((res) => {\n      this.rankView.loading = false;\n      this.rankView.status = res.ok ? (res.demo ? \'demo\' : \'cloud\') : \'off\';\n      if (res.ok && Array.isArray(res.list)) {\n        let list = res.list.map((x) => ({ name: x.name, score: x.score, me: false }));\n        const myBest = Math.max(this.stats.best, this.run ? this.run.score : 0);\n        // 只有真的有成绩才把自己的那一行补进榜里\n        if (myBest > 0 && !list.some((x) => x.me)) {\n          list.push({ name: (this.stats.wxName || this.stats.name) + \'（我）\', score: myBest, me: true });\n          list.sort((a, b) => b.score - a.score);\n          list = list.slice(0, 50);\n        }\n        this.rankView.list = list;\n      } else {\n        this.rankView.error = \'云环境未配置，暂无全服数据\';\n        this.rankView.list = this.stats.best > 0\n          ? [{ name: (this.stats.wxName || this.stats.name) + \'（我）\', score: this.stats.best, me: true }]\n          : [];\n      }\n    }).catch(() => {\n      this.rankView.loading = false;\n      this.rankView.error = \'网络开小差了，稍后再试\';\n    });\n  }\n\n  openAchievements() {\n    this.overlay = \'achv\';\n    if (this._userBtn) this._userBtn.hide();\n  }\n\n  editName() {\n    platform.editName(this.stats.name, (name) => {\n      if (!name) return;\n      this.stats.name = name.slice(0, 8);\n      storage.save(this.stats);\n      this.toast(\'厨师名已更新\');\n    });\n  }\n\n  // ---------------- 成就 ----------------\n  unlock(id) {\n    if (!id) return false;\n    if ((this.stats.unlocked || []).indexOf(id) >= 0) return false;\n    const def = ACHIEVEMENTS.find((a) => a.id === id);\n    if (!def) return false;\n    this.stats.unlocked.push(id);\n    storage.save(this.stats);\n    if (this.runUnlocked.indexOf(def) < 0) this.runUnlocked.push(def);\n    this.toast(\'🏅 \' + def.name);\n    audio.SFX.unlock();\n    this.achievementBanner(def.name, def.desc);\n    return true;\n  }\n\n  toast(text) {\n    this.toasts.push({ text, life: 1700 });\n    if (this.toasts.length > 3) this.toasts.shift();\n  }\n}\n\nmodule.exports = { Game };\n',
};

const cache = {};

function normalize(p) {
  const parts = [];
  p.split('/').forEach((seg) => {
    if (seg === '' || seg === '.') return;
    if (seg === '..') parts.pop();
    else parts.push(seg);
  });
  return parts.join('/');
}

function loadModule(id) {
  id = id.replace(/\.js$/, '');
  if (cache[id]) return cache[id].exports;
  const src = sources[id + '.js'];
  if (!src) throw new Error('missing module: ' + id);
  const module = { exports: {} };
  cache[id] = module;
  const dir = id.indexOf('/') >= 0 ? id.slice(0, id.lastIndexOf('/')) : '';
  const req = (p) => loadModule(p.startsWith('.') ? normalize(dir + '/' + p) : normalize(p));
  const fn = new Function('require', 'module', 'exports', src);
  fn(req, module, module.exports);
  return module.exports;
}

try {
  const { Game } = loadModule('js/app');
  const game = new Game();
  window.__game = game;
  game.boot();
} catch (e) {
  document.body.innerHTML = '<pre style="color:#f88;font:12px monospace;padding:12px;white-space:pre-wrap">' + e.stack + '</pre>';
}
</script>
